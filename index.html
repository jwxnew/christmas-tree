<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;
 overflow:hidden;background:#020104;
}
canvas{
 position:fixed;inset:0;
 width:100%;height:100%;
 cursor:grab;touch-action:none;
}
canvas:active{cursor:grabbing}

/* 第一行：for YJL */
#signature{
 position:fixed;
 bottom:9%;
 left:50%;
 transform:translateX(-50%);
 color:#f5eaff;
 font:italic clamp(28px,4vw,44px) Georgia,serif;
 letter-spacing:.14em;
 text-shadow:0 0 8px white,0 0 20px #c38bdf,0 0 35px #8d58aa;
 pointer-events:none;
 white-space:nowrap;
}

/* 第二行：Merry Christmas */
#message{
 position:fixed;
 left:50%;
 bottom:3%;
 transform:translateX(-50%);
 color:#f4dfff;
 font:italic clamp(18px,2.5vw,30px)
 "Brush Script MT","Segoe Script",cursive;
 text-shadow:0 0 5px white,0 0 13px #d58bfa,
 0 0 28px #a34acb;
 white-space:nowrap;
 pointer-events:none;
}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="signature">for YJL</div>
<div id="message">Merry Christmas</div>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");

let W,H,D;
let yaw=-0.24,pitch=0.30;
let targetYaw=yaw,targetPitch=pitch;
let zoom=1;
let dragging=false,lastX=0,lastY=0;
let time=0;

const TREE_H=270;          // 比之前略矮
const BASE_R=118;          // 比之前更宽，树更粗壮
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
resize();

function scale(){
 return Math.min(W/760,H/760)*.98*zoom;
}

/* =========================
   树主体粒子（更粗壮）
========================= */
const tree=[];

// 外层轮廓粒子：塑造树形
for(let i=0;i<3400;i++){
 const t=Math.pow(Math.random(),.82);
 const radius=BASE_R*Math.pow(1-t,.76);
 const r=radius*rand(.72,1.03);
 const a=rand(0,TAU);

 tree.push({
  x:r*Math.cos(a),
  y:-t*TREE_H+rand(-3,3),
  z:r*Math.sin(a),
  size:rand(.38,1.55),
  phase:rand(0,TAU),
  speed:rand(.7,2.6),
  color:Math.random()<.63?"#f5efff":
        Math.random()<.55?"#dfbbf7":"#ba80db"
 });
}

// 内层填充粒子：让树不再单薄
for(let i=0;i<2500;i++){
 const t=Math.pow(Math.random(),.92);
 const radius=BASE_R*Math.pow(1-t,.78);
 const r=radius*Math.sqrt(Math.random())*.95;
 const a=rand(0,TAU);

 tree.push({
  x:r*Math.cos(a),
  y:-t*TREE_H+rand(-2,2),
  z:r*Math.sin(a),
  size:rand(.30,1.2),
  phase:rand(0,TAU),
  speed:rand(.8,2.2),
  color:Math.random()<.72?"#fffaff":"#d8a9f2"
 });
}

// 分层枝条：让比例更像“树”
for(let level=0;level<11;level++){
 const t=(level+.35)/11.6;
 const radius=BASE_R*Math.pow(1-t,.74);

 for(let branch=0;branch<14;branch++){
  const angle=branch*TAU/14+level*.21;

  for(let j=0;j<24;j++){
   const u=j/23;
   const r=radius*(0.12+u*.96);
   const a=angle+u*.19;

   tree.push({
    x:r*Math.cos(a),
    y:-t*TREE_H+u*10+rand(-1.6,1.6),
    z:r*Math.sin(a),
    size:rand(.4,1.45),
    phase:rand(0,TAU),
    speed:rand(.7,2.3),
    color:Math.random()<.78?"#ffffff":"#d9aef2"
   });
  }
 }
}

/* =========================
   树身螺旋灯带
========================= */
const spiral=[];
for(let i=0;i<=820;i++){
 const t=i/820;
 const a=t*TAU*4.75;
 const r=BASE_R*Math.pow(1-t,.82)*1.02;

 spiral.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a)
 });
}

const bulbs=[];
for(let i=0;i<185;i++){
 const t=i/185;
 const a=t*TAU*4.75;
 const r=BASE_R*Math.pow(1-t,.82)*1.02;

 bulbs.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a),
  phase:rand(0,TAU),
  size:rand(1.1,2.8)
 });
}

/* =========================
   独立闪烁粒子
========================= */
const glitters=[];
for(let i=0;i<220;i++){
 const t=rand(.04,.98);
 const r=BASE_R*Math.pow(1-t,.78)*rand(.55,1.08);
 const a=rand(0,TAU);
 glitters.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a),
  phase:rand(0,TAU),
  size:rand(.8,2.8)
 });
}

/* =========================
   背景星空
========================= */
const stars=[];
for(let i=0;i<520;i++){
 stars.push({
  x:rand(0,1),
  y:rand(0,1),
  size:rand(.25,1.35),
  phase:rand(0,TAU)
 });
}

/* =========================
   雪花（增多）
========================= */
const snow=[];
for(let i=0;i<650;i++){
 snow.push({
  x:rand(0,W),
  y:rand(0,H),
  size:rand(.35,2.1),
  speed:rand(.35,1.9),
  drift:rand(-.45,.45),
  phase:rand(0,TAU)
 });
}

/* =========================
   地面银河粒子
========================= */
const ground=[];
for(let i=0;i<2100;i++){
 const a=rand(0,TAU);
 const r=BASE_R*rand(1.0,4.8);

 ground.push({
  x:r*Math.cos(a),
  y:rand(-1.2,1.2),
  z:r*Math.sin(a),
  size:rand(.35,1.5),
  phase:rand(0,TAU)
 });
}

/* =========================
   树周围环绕粒子轨道
========================= */
const orbiters=[
 {rx:BASE_R*1.45, rz:BASE_R*1.10, y:-TREE_H*0.22, amp:10, tilt:0.22, speed:0.65, color:"#f0d2ff", glow:"#d792ff"},
 {rx:BASE_R*1.18, rz:BASE_R*1.55, y:-TREE_H*0.48, amp:12, tilt:-0.18, speed:-0.52, color:"#ffffff", glow:"#f0d2ff"},
 {rx:BASE_R*1.65, rz:BASE_R*1.28, y:-TREE_H*0.70, amp:8, tilt:0.14, speed:0.44, color:"#dcb8f7", glow:"#c36ef1"}
];

/* =========================
   3D投影
========================= */
function project(p){
 const s=scale();

 const x1=p.x*Math.cos(yaw)-p.z*Math.sin(yaw);
 const z1=p.x*Math.sin(yaw)+p.z*Math.cos(yaw);

 const y1=p.y*Math.cos(pitch)-z1*Math.sin(pitch);
 const z2=p.y*Math.sin(pitch)+z1*Math.cos(pitch);

 const focal=1180;
 const k=focal/(focal+z2);

 return {
  x:W/2+x1*s*k,
  y:H*.71+y1*s*k,
  z:z2,
  k
 };
}

/* =========================
   基础发光点
========================= */
function dot(x,y,r,color,alpha,glow=false){
 ctx.globalAlpha=alpha;
 ctx.fillStyle=color;

 if(glow){
  ctx.shadowColor=color;
  ctx.shadowBlur=10;
 }

 ctx.beginPath();
 ctx.arc(x,y,Math.max(.25,r),0,TAU);
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.globalAlpha=1;
}

/* =========================
   星空
========================= */
function drawStars(){
 for(const s of stars){
  const a=.18+.62*(.5+.5*Math.sin(time*1.3+s.phase));
  dot(s.x*W,s.y*H,s.size,"#dbc9eb",a);
 }
}

/* =========================
   雪花
========================= */
function drawSnow(){
 for(const s of snow){
  s.y+=s.speed;
  s.x+=s.drift+Math.sin(time*1.2+s.phase)*.28;

  if(s.y>H+6){
   s.y=-6;
   s.x=rand(0,W);
  }
  if(s.x<0)s.x=W;
  if(s.x>W)s.x=0;

  const a=.22+.70*(.5+.5*Math.sin(time*1.8+s.phase));
  dot(s.x,s.y,s.size,"#f7efff",a,s.size>1.5);
 }
}

/* =========================
   地面光环 + 粒子
========================= */
function drawRings(){
 const s=scale();
 const radii=[1.25,1.62,2.05,2.55,3.15,3.85,4.55];

 for(let j=0;j<radii.length;j++){
  const r=BASE_R*radii[j];
  const points=[];

  for(let i=0;i<=240;i++){
   const a=i/240*TAU;
   points.push(project({
    x:r*Math.cos(a),y:0,
    z:r*Math.sin(a)
   }));
  }

  ctx.beginPath();
  points.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  });

  ctx.strokeStyle=j%2===0?
   "rgba(190,120,232,.34)":
   "rgba(228,198,247,.18)";
  ctx.lineWidth=1.05*s;
  ctx.shadowColor="#c274ed";
  ctx.shadowBlur=9;
  ctx.stroke();
  ctx.shadowBlur=0;
 }

 for(const g of ground){
  const p=project(g);
  const a=.18+.62*Math.pow(.5+.5*Math.sin(time*1.1+g.phase),2);
  dot(p.x,p.y,g.size*p.k,
      "#cfa4e9",a,g.size>1);
 }
}

/* =========================
   树主体
========================= */
function drawTree(){
 const list=tree.map(p=>({p,q:project(p)}));
 list.sort((a,b)=>b.q.z-a.q.z);

 for(const item of list){
  const p=item.p,q=item.q;

  const flicker=.23+.77*Math.pow(
   .5+.5*Math.sin(time*p.speed+p.phase),2.7
  );

  const alpha=flicker*(.62+.38*q.k);
  const r=p.size*q.k*scale()*.92;

  dot(q.x,q.y,r,p.color,alpha,r>1.1);
 }
}

/* =========================
   螺旋灯带
========================= */
function drawSpiral(){
 const points=spiral.map(project);

 ctx.beginPath();
 points.forEach((p,i)=>{
  if(i===0)ctx.moveTo(p.x,p.y);
  else ctx.lineTo(p.x,p.y);
 });

 ctx.strokeStyle="rgba(223,175,248,.80)";
 ctx.lineWidth=1.35*scale();
 ctx.shadowColor="#e1a6ff";
 ctx.shadowBlur=14;
 ctx.stroke();

 ctx.strokeStyle="rgba(255,248,255,.58)";
 ctx.lineWidth=.56*scale();
 ctx.shadowBlur=5;
 ctx.stroke();
 ctx.shadowBlur=0;

 for(const b of bulbs){
  const p=project(b);
  const f=.18+.82*(.5+.5*Math.sin(time*2.8+b.phase));
  dot(p.x,p.y,b.size*p.k*scale(),
      "#f8e3ff",f,true);
 }

 for(const g of glitters){
  const p=project(g);
  const f=Math.pow(.5+.5*Math.sin(time*2.2+g.phase),4.8);
  dot(p.x,p.y,g.size*p.k*scale(),
      "#fffaff",f,true);
 }
}

/* =========================
   树周围环绕效果
========================= */
function orbitPoint(o, t){
 const a=t*TAU;
 let x=Math.cos(a)*o.rx;
 let z=Math.sin(a)*o.rz;
 let y=o.y+Math.sin(a*2+time*o.speed)*o.amp;

 // 模拟轻微倾斜
 const yy=y*Math.cos(o.tilt)-z*Math.sin(o.tilt);
 const zz=y*Math.sin(o.tilt)+z*Math.cos(o.tilt);

 return {x, y:yy, z:zz};
}

function drawOrbiters(){
 for(const o of orbiters){
  const pts=[];

  for(let i=0;i<=140;i++){
   const t=i/140;
   pts.push(project(orbitPoint(o,t)));
  }

  // faint path
  ctx.beginPath();
  pts.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  });
  ctx.strokeStyle="rgba(245,220,255,0.10)";
  ctx.lineWidth=.9*scale();
  ctx.shadowColor=o.glow;
  ctx.shadowBlur=6;
  ctx.stroke();
  ctx.shadowBlur=0;

  // moving beads
  for(let k=0;k<18;k++){
   const tt=((time*o.speed*0.08)+k/18)%1;
   const p=project(orbitPoint(o,tt<0?tt+1:tt));
   const alpha=.18+.68*(1-k/22);
   const rr=(1.4-k*0.04)*scale()*p.k;
   dot(p.x,p.y,rr,o.color,alpha,true);
  }

  // leader comet
  const lead=project(orbitPoint(o,((time*o.speed*0.10)%1+1)%1));
  dot(lead.x,lead.y,2.7*scale()*lead.k,"#ffffff",.95,true);
 }
}

/* =========================
   顶部水晶装饰
========================= */
function drawTopStar(){
 const p=project({x:0,y:-TREE_H-24,z:0});
 const s=scale();
 const pulse=1+0.08*Math.sin(time*2.2);

 const h=17*s*pulse;
 const w=8*s*pulse;

 ctx.save();
 ctx.translate(p.x,p.y);

 const glow=ctx.createRadialGradient(0,0,0,0,0,h*2.9);
 glow.addColorStop(0,"rgba(255,255,255,0.96)");
 glow.addColorStop(0.22,"rgba(247,232,255,0.58)");
 glow.addColorStop(0.50,"rgba(214,168,255,0.22)");
 glow.addColorStop(1,"rgba(180,120,255,0)");
 ctx.fillStyle=glow;
 ctx.beginPath();
 ctx.arc(0,0,h*2.9,0,TAU);
 ctx.fill();

 ctx.shadowColor="#ffffff";
 ctx.shadowBlur=20;

 const crystal=ctx.createLinearGradient(-w,-h,w,h*1.25);
 crystal.addColorStop(0,"rgba(255,255,255,0.98)");
 crystal.addColorStop(0.35,"rgba(242,228,255,0.95)");
 crystal.addColorStop(0.7,"rgba(212,186,255,0.92)");
 crystal.addColorStop(1,"rgba(255,255,255,0.98)");
 ctx.fillStyle=crystal;

 ctx.beginPath();
 ctx.moveTo(0,-h);
 ctx.lineTo(w,0);
 ctx.lineTo(0,h*1.25);
 ctx.lineTo(-w,0);
 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.strokeStyle="rgba(255,255,255,0.76)";
 ctx.lineWidth=Math.max(0.8,1.1*s);

 ctx.beginPath();
 ctx.moveTo(0,-h);
 ctx.lineTo(0,h*1.25);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,-h*0.05);
 ctx.lineTo(-w*0.82,0);
 ctx.lineTo(0,h*0.62);
 ctx.lineTo(w*0.82,0);
 ctx.closePath();
 ctx.stroke();

 ctx.fillStyle="#ffffff";
 ctx.beginPath();
 ctx.arc(0,-h,1.9*s,0,TAU);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,h*1.25,1.6*s,0,TAU);
 ctx.fill();

 function sparkle(x,y,r,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.globalAlpha=alpha;
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=Math.max(0.8,1*s);
  ctx.shadowColor="#ffffff";
  ctx.shadowBlur=8;

  ctx.beginPath();
  ctx.moveTo(-r,0);
  ctx.lineTo(r,0);
  ctx.moveTo(0,-r);
  ctx.lineTo(0,r);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-r*.6,-r*.6);
  ctx.lineTo(r*.6,r*.6);
  ctx.moveTo(r*.6,-r*.6);
  ctx.lineTo(-r*.6,r*.6);
  ctx.stroke();
  ctx.restore();
 }

 const tw=.55+.45*Math.sin(time*3.2);
 sparkle(-w*1.45,-h*.15,3.5*s,.34+.36*tw);
 sparkle(w*1.58,h*.05,2.9*s,.25+.28*tw);
 sparkle(0,-h*1.45,2.6*s,.20+.25*tw);

 ctx.restore();
}

/* =========================
   树底暖光
========================= */
function drawBaseGlow(){
 const x=W/2;
 const y=H*.71;
 const s=scale();

 const g=ctx.createRadialGradient(x,y,0,x,y,58*s);
 g.addColorStop(0,"rgba(255,214,168,.75)");
 g.addColorStop(.18,"rgba(229,158,222,.38)");
 g.addColorStop(.50,"rgba(170,100,216,.12)");
 g.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(x,y,58*s,0,TAU);
 ctx.fill();
}

/* =========================
   主动画
========================= */
function animate(){
 requestAnimationFrame(animate);
 time+=.016;

 if(!dragging)targetYaw+=.00085;

 yaw+=(targetYaw-yaw)*.08;
 pitch+=(targetPitch-pitch)*.08;

 pitch=clamp(pitch,.10,1.05);

 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#020104";
 ctx.fillRect(0,0,W,H);

 drawStars();
 drawSnow();
 drawRings();
 drawBaseGlow();
 drawOrbiters();   // 新增：树周围环绕效果
 drawTree();
 drawSpiral();
 drawTopStar();
}

animate();

/* =========================
   鼠标拖动旋转
========================= */
canvas.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;

 targetYaw+=(e.clientX-lastX)*.007;
 targetPitch+=(e.clientY-lastY)*.004;

 lastX=e.clientX;
 lastY=e.clientY;
});

function stopDrag(){dragging=false;}
canvas.addEventListener("pointerup",stopDrag);
canvas.addEventListener("pointercancel",stopDrag);

/* 滚轮微调观察角度 */
canvas.addEventListener("wheel",e=>{
 targetPitch=clamp(
  targetPitch+e.deltaY*.0004,
  .10,
  1.05
 );
},{passive:true});
</script>
</body>
</html>
