
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03010a;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
}

canvas:active {
    cursor: grabbing;
}

#signature, #message {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
}

#signature {
    bottom: 9%;
    color: #f8edff;
    font: italic clamp(27px, 4vw, 44px) Georgia, serif;
    letter-spacing: .15em;
    text-shadow:
        0 0 8px #ffffff,
        0 0 22px #d9a8ff,
        0 0 45px #a34ce8;
}

#message {
    bottom: 3%;
    color: #e9cfff;
    font: italic clamp(19px, 2.7vw, 31px)
        "Brush Script MT", "Segoe Script", cursive;
    text-shadow:
        0 0 6px #ffffff,
        0 0 16px #d58bfa,
        0 0 32px #a34acb;
}
</style>
</head>

<body>

<div id="signature">for YJL</div>
<div id="message">Merry Christmas</div>

<script type="module">

/* =========================================
   1. 加载 Three.js
========================================= */

let THREE;

try {
    THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
    );
} catch (error) {
    THREE = await import(
        "https://unpkg.com/three@0.164.1/build/three.module.js"
    );
}


/* =========================================
   2. 场景初始化
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03010a);

scene.fog = new THREE.FogExp2(0x03010a, 0.009);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.35;

document.body.appendChild(renderer.domElement);


/* =========================================
   3. 相机与真正的3D旋转
========================================= */

const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

const cameraTarget = new THREE.Vector3(0, 2.65, 0);

let azimuth = 0;
let polar = 1.32;
let distance = 12.5;

let dragging = false;
let lastX = 0;
let lastY = 0;

function updateCamera() {

    camera.position.set(
        distance * Math.sin(polar) * Math.sin(azimuth),
        cameraTarget.y + distance * Math.cos(polar),
        distance * Math.sin(polar) * Math.cos(azimuth)
    );

    camera.lookAt(cameraTarget);
}

updateCamera();


/* =========================================
   4. 鼠标操作
========================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    e => {
        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        renderer.domElement.setPointerCapture(e.pointerId);
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e => {
        if (!dragging) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        azimuth -= dx * 0.006;

        polar = THREE.MathUtils.clamp(
            polar + dy * 0.004,
            0.25,
            2.65
        );

        lastX = e.clientX;
        lastY = e.clientY;

        updateCamera();
    }
);

function stopDragging() {
    dragging = false;
}

renderer.domElement.addEventListener(
    "pointerup", stopDragging
);

renderer.domElement.addEventListener(
    "pointercancel", stopDragging
);

renderer.domElement.addEventListener(
    "wheel",
    e => {
        e.preventDefault();

        distance = THREE.MathUtils.clamp(
            distance + e.deltaY * 0.008,
            8,
            18
        );

        updateCamera();
    },
    { passive: false }
);


/* =========================================
   5. 基础参数
========================================= */

const TAU = Math.PI * 2;

const TREE_H = 5.5;

const BASE_R = 2.25;

const rand = (a, b) => a + Math.random() * (b - a);

const treeGroup = new THREE.Group();

scene.add(treeGroup);

const clock = new THREE.Clock();

let elapsed = 0;


/* =========================================
   6. 灯光
========================================= */

scene.add(
    new THREE.AmbientLight(0xc9a8ff, 1.0)
);

scene.add(
    new THREE.HemisphereLight(
        0xf0dcff,
        0x170820,
        1.2
    )
);

const light1 = new THREE.PointLight(
    0xd49aff, 35, 16
);

light1.position.set(0, 4.5, 3);

scene.add(light1);

const light2 = new THREE.PointLight(
    0xffffff, 22, 14
);

light2.position.set(-4, 5, 3);

scene.add(light2);

const light3 = new THREE.PointLight(
    0x9d50ed, 30, 14
);

light3.position.set(4, 3, -4);

scene.add(light3);


/* =========================================
   7. 梦幻紫色光晕纹理
========================================= */

function createGlowTexture() {

    const canvas = document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const c = canvas.getContext("2d");

    const g = c.createRadialGradient(
        128, 128, 0,
        128, 128, 128
    );

    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.15, "rgba(225,170,255,0.65)");
    g.addColorStop(0.4, "rgba(157,82,220,0.22)");
    g.addColorStop(1, "rgba(100,30,160,0)");

    c.fillStyle = g;

    c.fillRect(0, 0, 256, 256);

    const texture = new THREE.CanvasTexture(canvas);

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

const glowTexture = createGlowTexture();


/* =========================================
   8. 背景星云
========================================= */

function addNebula(x, y, z, sx, sy, opacity) {

    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: glowTexture,
            color: 0xb77be8,
            transparent: true,
            opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    sprite.position.set(x, y, z);

    sprite.scale.set(sx, sy, 1);

    scene.add(sprite);

    return sprite;
}

addNebula(-4, 4, -9, 9, 7, 0.23);
addNebula(4, 3, -10, 8, 7, 0.18);
addNebula(0, 6, -13, 12, 8, 0.15);
addNebula(0, 1, -9, 7, 5, 0.12);


/* =========================================
   9. 星空粒子
========================================= */

const starPositions = [];

const starColors = [];

for (let i = 0; i < 650; i++) {

    starPositions.push(
        rand(-15, 15),
        rand(-4, 13),
        rand(-19, -10)
    );

    const color = new THREE.Color(
        Math.random() > 0.55
            ? 0xf0dcff
            : 0xb990e8
    );

    starColors.push(color.r, color.g, color.b);
}

const starFieldGeometry = new THREE.BufferGeometry();

starFieldGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

starFieldGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(starColors, 3)
);

const starFieldMaterial = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

scene.add(
    new THREE.Points(starFieldGeometry, starFieldMaterial)
);


/* =========================================
   10. 树体分层结构
========================================= */

for (let level = 0; level < 8; level++) {

    const y0 = 0.35 + level * 0.63;

    const height = 0.92;

    const rBottom =
        BASE_R * Math.pow(1 - level / 8, 0.82);

    const rTop = Math.max(
        0.025,
        BASE_R *
        Math.pow(1 - (level + 1) / 8, 0.82) * 0.88
    );

    const geometry = new THREE.CylinderGeometry(
        rTop,
        rBottom,
        height,
        24,
        3,
        true
    );

    const material = new THREE.MeshStandardMaterial({
        color: 0x43195c,
        emissive: 0x37104e,
        emissiveIntensity: 0.6,
        transparent: true,
        opacity: 0.09,
        roughness: 0.7,
        metalness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: true
    });

    const layer = new THREE.Mesh(
        geometry,
        material
    );

    layer.position.y = y0 + height / 2;

    treeGroup.add(layer);
}


/* =========================================
   11. 树体粒子生成
========================================= */

const treeColors = [
    "#ffffff",
    "#f8efff",
    "#ead5ff",
    "#d5aaff",
    "#bd82ed",
    "#a969d9"
];

const bodyPoints = [];

for (let i = 0; i < 6500; i++) {

    const t = Math.random() * 0.985;

    const angle = rand(0, TAU);

    const maxR = BASE_R * Math.pow(1 - t, 0.80);

    const radial = Math.random() < 0.66
        ? rand(0.72, 1.0)
        : Math.sqrt(Math.random()) * 0.80;

    const tierWave =
        0.94 +
        0.06 * Math.sin(
            t * 8 * TAU + angle * 3
        );

    const r = maxR * radial * tierWave;

    bodyPoints.push({
        x: r * Math.cos(angle),
        y: 0.25 + t * 5.15,
        z: r * Math.sin(angle),
        color: treeColors[
            Math.floor(Math.random() * treeColors.length)
        ]
    });
}


/* =========================================
   12. 分层枝条粒子
========================================= */

const branchPoints = [];

for (let level = 0; level < 8; level++) {

    const centerY = 0.65 + level * 0.63;

    const branchLength =
        BASE_R *
        Math.pow(1 - level / 8, 0.85) *
        1.04;

    for (let branch = 0; branch < 18; branch++) {

        const angle =
            branch * TAU / 18 + level * 0.17;

        for (let j = 0; j <= 26; j++) {

            const u = j / 26;

            const r = 0.10 + branchLength * u;

            const droop = 0.34 * u * u;

            for (let k = 0; k < 3; k++) {

                const side = rand(-1, 1) *
                    (0.045 + 0.07 * (1 - u));

                const x =
                    r * Math.cos(angle) -
                    side * Math.sin(angle);

                const z =
                    r * Math.sin(angle) +
                    side * Math.cos(angle);

                branchPoints.push({
                    x,
                    y: centerY - droop + rand(-0.06, 0.06),
                    z,
                    color: Math.random() < 0.68
                        ? "#ffffff"
                        : "#dcb6ff"
                });
            }
        }
    }
}


/* =========================================
   13. 粒子云生成器
========================================= */

function createPointCloud(points, size, opacity) {

    const positions = [];

    const colors = [];

    for (const p of points) {

        positions.push(p.x, p.y, p.z);

        const c = new THREE.Color(p.color);

        colors.push(c.r, c.g, c.b);
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
    );

    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(colors, 3)
    );

    const material = new THREE.PointsMaterial({
        size,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: true,
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(
        geometry,
        material
    );

    treeGroup.add(particles);

    return particles;
}

const bodyCloud = createPointCloud(
    bodyPoints, 0.055, 0.94
);

const branchCloud = createPointCloud(
    branchPoints, 0.065, 0.96
);


/* =========================================
   14. 树干
========================================= */

const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.12, 0.17, 0.85, 16
    ),
    new THREE.MeshStandardMaterial({
        color: 0x4c2452,
        roughness: 0.85
    })
);

trunk.position.y = 0.35;

treeGroup.add(trunk);


/* =========================================
   15. 圣诞装饰球
========================================= */

const ornamentGeometry = new THREE.SphereGeometry(
    1, 16, 12
);

const ornamentMaterials = [
    new THREE.MeshPhysicalMaterial({
        color: 0xf5eaff,
        metalness: 0.85,
        roughness: 0.16,
        clearcoat: 1,
        emissive: 0x8e55ad,
        emissiveIntensity: 0.5
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xb77be8,
        metalness: 0.72,
        roughness: 0.18,
        clearcoat: 1,
        emissive: 0x6e2ca0,
        emissiveIntensity: 0.65
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.92,
        roughness: 0.12,
        clearcoat: 1
    })
];

for (let i = 0; i < 38; i++) {

    const t = rand(0.12, 0.86);

    const maxR = BASE_R * Math.pow(1 - t, 0.80);

    const angle = rand(0, TAU);

    const radius = maxR * rand(0.86, 1.0);

    const size = rand(0.045, 0.085);

    const ornament = new THREE.Mesh(
        ornamentGeometry,
        ornamentMaterials[
            Math.floor(Math.random() * ornamentMaterials.length)
        ]
    );

    ornament.scale.setScalar(size);

    ornament.position.set(
        radius * Math.cos(angle),
        0.35 + t * 4.9,
        radius * Math.sin(angle)
    );

    treeGroup.add(ornament);
}


/* =========================================
   16. 树身螺旋灯带
========================================= */

const spiralPoints = [];

for (let i = 0; i <= 1000; i++) {

    const t = i / 1000;

    const angle = t * TAU * 5.2;

    const radius =
        BASE_R * 0.94 * Math.pow(1 - t, 0.83);

    spiralPoints.push(
        new THREE.Vector3(
            radius * Math.cos(angle),
            0.35 + t * 5.05,
            radius * Math.sin(angle)
        )
    );
}

const spiralCurve = new THREE.CatmullRomCurve3(
    spiralPoints
);

const spiralGeometry = new THREE.TubeGeometry(
    spiralCurve,
    1000,
    0.013,
    6,
    false
);

treeGroup.add(
    new THREE.Mesh(
        spiralGeometry,
        new THREE.MeshBasicMaterial({
            color: 0xd9a5ff,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    )
);

// 外层柔光
treeGroup.add(
    new THREE.Mesh(
        new THREE.TubeGeometry(
            spiralCurve,
            1000,
            0.04,
            6,
            false
        ),
        new THREE.MeshBasicMaterial({
            color: 0xa95de0,
            transparent: true,
            opacity: 0.18,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    )
);


/* =========================================
   17. 树身闪烁灯珠
========================================= */

const bulbs = [];

const bulbGeometry = new THREE.SphereGeometry(
    0.026, 10, 8
);

for (let i = 0; i < 140; i++) {

    const t = i / 140;

    const p = spiralCurve.getPointAt(t);

    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xdca9ff,
        emissiveIntensity: 1.8,
        roughness: 0.2
    });

    const bulb = new THREE.Mesh(
        bulbGeometry,
        material
    );

    bulb.position.copy(p);

    treeGroup.add(bulb);

    bulbs.push({
        mesh: bulb,
        material,
        phase: rand(0, TAU)
    });
}


/* =========================================
   18. 树顶八角水晶星星
========================================= */

const starShape = new THREE.Shape();

for (let i = 0; i < 16; i++) {

    const angle = -Math.PI / 2 + i * Math.PI / 8;

    const radius = i % 2 === 0 ? 0.34 : 0.145;

    const x = Math.cos(angle) * radius;

    const y = Math.sin(angle) * radius;

    if (i === 0) {
        starShape.moveTo(x, y);
    } else {
        starShape.lineTo(x, y);
    }
}

starShape.closePath();

const starGeometry = new THREE.ExtrudeGeometry(
    starShape,
    {
        depth: 0.08,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
    }
);

const starMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0.55,
    roughness: 0.12,
    clearcoat: 1,
    emissive: 0xdcb0ff,
    emissiveIntensity: 2.1
});

const starGroup = new THREE.Group();

starGroup.position.set(0, TREE_H + 0.05, 0);

treeGroup.add(starGroup);

const starMesh = new THREE.Mesh(
    starGeometry,
    starMaterial
);

starGroup.add(starMesh);

starMesh.rotation.z = 0;

// 水晶切面
starMesh.add(
    new THREE.LineSegments(
        new THREE.EdgesGeometry(starGeometry),
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.9
        })
    )
);

// 星星周围的光晕
const starHalo = new THREE.Sprite(
    new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xe2b5ff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

starHalo.scale.set(1.5, 1.5, 1);

starGroup.add(starHalo);


/* =========================================
   19. 地面光晕
========================================= */

const floorGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(7, 7),
    new THREE.MeshBasicMaterial({
        map: glowTexture,
        color: 0xc58bff,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
    })
);

floorGlow.rotation.x = -Math.PI / 2;

floorGlow.position.y = 0.035;

treeGroup.add(floorGlow);


/* =========================================
   20. 地面环形光轨
========================================= */

const baseRings = [];

[2.55, 3.15, 3.85].forEach((radius, i) => {

    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
            radius, 0.009, 6, 240
        ),
        new THREE.MeshBasicMaterial({
            color: i === 1 ? 0xe0b7ff : 0xa96de2,
            transparent: true,
            opacity: 0.30,
            blending: THREE.AdditiveBlending
        })
    );

    ring.rotation.x = Math.PI / 2;

    ring.position.y = 0.05 + i * 0.012;

    treeGroup.add(ring);

    baseRings.push(ring);
});


/* =========================================
   21. 四组真正的3D环绕轨道
========================================= */

const orbitSpecs = [
    {
        y: 1.35,
        rx: 2.65,
        rz: 2.15,
        tiltX: 0.48,
        tiltZ: -0.18,
        wave: 0.13,
        phase: 0.2,
        color: 0xe4b5ff,
        speed: 0.70
    },

    {
        y: 2.65,
        rx: 2.35,
        rz: 2.75,
        tiltX: -0.52,
        tiltZ: 0.20,
        wave: 0.16,
        phase: 1.5,
        color: 0xffffff,
        speed: -0.55
    },

    {
        y: 3.85,
        rx: 1.65,
        rz: 1.95,
        tiltX: 0.32,
        tiltZ: 0.38,
        wave: 0.10,
        phase: 2.4,
        color: 0xd5a1ff,
        speed: 0.82
    },

    {
        y: 2.05,
        rx: 2.90,
        rz: 2.40,
        tiltX: -0.25,
        tiltZ: -0.42,
        wave: 0.18,
        phase: 3.1,
        color: 0xe9caff,
        speed: -0.36
    }
];

const orbitSystems = [];

function createOrbit(spec) {

    const group = new THREE.Group();

    group.position.y = spec.y;

    group.rotation.set(
        spec.tiltX,
        0,
        spec.tiltZ
    );

    treeGroup.add(group);

    const points = [];

    for (let i = 0; i < 360; i++) {

        const a = i / 360 * TAU;

        points.push(
            new THREE.Vector3(
                spec.rx * Math.cos(a),
                Math.sin(a * 2 + spec.phase) * spec.wave,
                spec.rz * Math.sin(a)
            )
        );
    }

    const curve = new THREE.CatmullRomCurve3(
        points,
        true,
        "centripetal"
    );

    // 外层光晕
    group.add(
        new THREE.Mesh(
            new THREE.TubeGeometry(
                curve, 600, 0.043, 6, true
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.17,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        )
    );

    // 内层光带
    group.add(
        new THREE.Mesh(
            new THREE.TubeGeometry(
                curve, 600, 0.012, 6, true
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.82,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        )
    );

    // 流动光珠
    const beads = [];

    const beadGeometry = new THREE.SphereGeometry(
        0.025, 8, 8
    );

    const beadMaterial = new THREE.MeshBasicMaterial({
        color: spec.color
    });

    for (let i = 0; i < 22; i++) {

        const bead = new THREE.Mesh(
            beadGeometry,
            beadMaterial
        );

        group.add(bead);

        beads.push(bead);
    }

    // 彗星头部
    const comet = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 12, 12),
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })
    );

    group.add(comet);

    // 彗星拖尾
    const tail = [];

    for (let i = 0; i < 9; i++) {

        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(
                0.045 * (1 - i / 13),
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.65 * (1 - i / 10),
                blending: THREE.AdditiveBlending
            })
        );

        group.add(particle);

        tail.push(particle);
    }

    orbitSystems.push({
        curve,
        beads,
        comet,
        tail,
        speed: spec.speed,
        phase: spec.phase
    });
}

orbitSpecs.forEach(createOrbit);


/* =========================================
   22. 雪花系统
   远景120片 + 近景40片
========================================= */

function createSnow(count, zMin, zMax, size, opacity) {

    const positions = new Float32Array(count * 3);

    const speeds = [];
    const drifts = [];
    const phases = [];

    for (let i = 0; i < count; i++) {

        positions[i * 3] = rand(-6.5, 6.5);

        positions[i * 3 + 1] = rand(-0.5, 7.5);

        positions[i * 3 + 2] = rand(zMin, zMax);

        speeds.push(rand(0.28, 0.85));

        drifts.push(rand(-0.25, 0.25));

        phases.push(rand(0, TAU));
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({
        color: 0xf6eaff,
        size,
        transparent: true,
        opacity,
        depthWrite: false,
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(
        geometry,
        material
    );

    scene.add(points);

    return {
        geometry,
        speeds,
        drifts,
        phases,
        count
    };
}

const farSnow = createSnow(
    120, -9, -5, 0.055, 0.48
);

const nearSnow = createSnow(
    40, 3.5, 5.5, 0.11, 0.68
);


/* =========================================
   23. 修复后的雪花运动
========================================= */

function updateSnow(snow, dt) {

    // 必须直接修改 BufferGeometry 的真实数据
    const positions =
        snow.geometry.attributes.position.array;

    for (let i = 0; i < snow.count; i++) {

        const index = i * 3;

        positions[index + 1] -=
            snow.speeds[i] * dt;

        positions[index] += (
            snow.drifts[i] +
            Math.sin(
                elapsed * 1.2 + snow.phases[i]
            ) * 0.08
        ) * dt;

        if (positions[index + 1] < -0.8) {

            positions[index + 1] = 7.8;

            positions[index] = rand(-6.5, 6.5);
        }

        if (positions[index] > 6.5) {
            positions[index] = -6.5;
        }

        if (positions[index] < -6.5) {
            positions[index] = 6.5;
        }
    }

    snow.geometry.attributes.position.needsUpdate = true;
}


/* =========================================
   24. 灯珠闪烁
========================================= */

function updateBulbs() {

    for (const b of bulbs) {

        const f =
            0.5 +
            0.5 * Math.sin(
                elapsed * 2.8 + b.phase
            );

        b.material.emissiveIntensity =
            0.7 + f * 2.3;

        b.mesh.scale.setScalar(
            0.75 + f * 0.55
        );
    }
}


/* =========================================
   25. 环绕粒子与彗星运动
========================================= */

function updateOrbits() {

    for (const system of orbitSystems) {

        const t = (
            elapsed * system.speed * 0.055 +
            system.phase / TAU
        );

        const normalizedT = ((t % 1) + 1) % 1;

        system.beads.forEach((bead, i) => {

            const beadT = (
                normalizedT + i / system.beads.length
            ) % 1;

            bead.position.copy(
                system.curve.getPointAt(beadT)
            );

            const pulse =
                0.65 +
                0.35 * Math.sin(elapsed * 2 + i);

            bead.scale.setScalar(pulse);
        });

        system.comet.position.copy(
            system.curve.getPointAt(normalizedT)
        );

        system.tail.forEach((particle, i) => {

            const tailT = (
                normalizedT - (i + 1) * 0.007 + 1
            ) % 1;

            particle.position.copy(
                system.curve.getPointAt(tailT)
            );
        });
    }
}


/* =========================================
   26. 水晶星星闪烁
========================================= */

function updateStar() {

    starGroup.rotation.y =
        Math.sin(elapsed * 0.6) * 0.12;

    const pulse =
        1 + 0.06 * Math.sin(elapsed * 2.4);

    starMesh.scale.setScalar(pulse);

    starMaterial.emissiveIntensity =
        1.5 + 1.2 * (
            0.5 + 0.5 * Math.sin(elapsed * 2.4)
        );

    starHalo.material.opacity =
        0.55 + 0.35 * (
            0.5 + 0.5 * Math.sin(elapsed * 2)
        );
}


/* =========================================
   27. 星空呼吸效果
========================================= */

function updateStars() {

    starFieldMaterial.opacity =
        0.55 + 0.3 * (
            0.5 + 0.5 * Math.sin(elapsed * 1.2)
        );
}


/* =========================================
   28. 窗口尺寸变化
========================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});


/* =========================================
   29. 主动画
========================================= */

function animate() {

    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.04);

    elapsed += dt;

    // 自动缓慢旋转
    if (!dragging) {
        azimuth += dt * 0.055;
        updateCamera();
    }

    // 更新树身灯光
    updateBulbs();

    // 更新环绕轨迹
    updateOrbits();

    // 更新水晶星星
    updateStar();

    // 更新背景星空
    updateStars();

    // 更新雪花
    updateSnow(farSnow, dt);

    updateSnow(nearSnow, dt);

    // 地面光环缓慢运动
    baseRings.forEach((ring, i) => {
        ring.rotation.z =
            Math.sin(elapsed * 0.15 + i) * 0.06;
    });

    // 光照呼吸
    light1.intensity =
        29 + 6 * Math.sin(elapsed * 0.8);

    renderer.render(scene, camera);
}

animate();

</script>
