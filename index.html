
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#030205;
}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
#dedication{
 position:fixed;bottom:6%;left:50%;
 transform:translateX(-50%);
 color:#f1d9fa;
 font:italic clamp(25px,4vw,48px) Georgia,serif;
 letter-spacing:.12em;
 text-shadow:0 0 8px #fff,0 0 20px #c18bdc,0 0 38px #86549e;
 pointer-events:none;
 white-space:nowrap;
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="dedication">for yjl</div>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");

let W,H,D;
let yaw=-0.35,pitch=-0.12;
let targetYaw=yaw,targetPitch=pitch;
let dragging=false,lastX=0,lastY=0;
let time=0;

function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 D=devicePixelRatio;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

// 圣诞树粒子
const particles=[];
const COUNT=7200;
for(let i=0;i<COUNT;i++){
 const y=Math.random();
 const radius=175*Math.pow(1-y,0.86);
 const angle=rand(0,TAU);
 const r=radius*Math.sqrt(Math.random());
 particles.push({
  x:r*Math.cos(angle),
  y:-y*480,
  z:r*Math.sin(angle),
  size:rand(.35,1.5),
  phase:rand(0,TAU),
  speed:rand(.6,2.4),
  color:Math.random()<.22?"#d5a5ed":
        Math.random()<.35?"#f5e8ff":"#e9e9ef",
  alpha:rand(.25,.95)
 });
}

// 螺旋灯带
const spiral=[];
for(let i=0;i<1100;i++){
 const t=i/1099;
 const a=t*Math.PI*2*5.4;
 const r=170*(1-t)*.96;
 spiral.push({
  x:r*Math.cos(a),
  y:-t*475,
  z:r*Math.sin(a)
 });
}

// 螺旋灯珠
const bulbs=[];
for(let i=0;i<170;i++){
 const t=i/170;
 const a=t*Math.PI*2*5.4;
 const r=170*(1-t)*.96;
 bulbs.push({
  x:r*Math.cos(a),
  y:-t*475,
  z:r*Math.sin(a),
  phase:rand(0,TAU),
  size:rand(1,3)
 });
}

// 空中飘雪
const snow=[];
for(let i=0;i<500;i++){
 snow.push({
  x:rand(-W,W),
  y:rand(-H,H),
  z:rand(.3,1.5),
  size:rand(.4,2.2),
  speed:rand(.5,2.1),
  drift:rand(-.5,.5),
  phase:rand(0,TAU)
 });
}

// 变换及透视投影
function project(p){
 let x=p.x,y=p.y,z=p.z;

 let x1=x*Math.cos(yaw)-z*Math.sin(yaw);
 let z1=x*Math.sin(yaw)+z*Math.cos(yaw);

 let y1=y*Math.cos(pitch)-z1*Math.sin(pitch);
 let z2=y*Math.sin(pitch)+z1*Math.cos(pitch);

 const scale=Math.min(innerWidth/950,innerHeight/850);
 const focal=1000;
 const k=focal/(focal+z2);

 return {
  x:innerWidth/2+x1*k*scale,
  y:innerHeight*.73+y1*k*scale,
  z:z2,
  k
 };
}

// 发光粒子
function glow(x,y,r,color,alpha=1){
 ctx.globalAlpha=alpha;
 ctx.shadowBlur=r*5;
 ctx.shadowColor=color;
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x,y,r,0,TAU);
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.globalAlpha=1;
}

// 星星
function drawStar(x,y,outer){
 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor="#ffffff";
 ctx.shadowBlur=30;
 ctx.fillStyle="#fff";
 ctx.beginPath();
 for(let i=0;i<8;i++){
  const a=-Math.PI/2+i*Math.PI/4;
  const r=i%2===0?outer:outer*.2;
  const xx=Math.cos(a)*r;
  const yy=Math.sin(a)*r;
  if(i===0)ctx.moveTo(xx,yy);
  else ctx.lineTo(xx,yy);
 }
 ctx.closePath();
 ctx.fill();
 ctx.restore();
}

// 银河底座
function drawRings(){
 for(let j=0;j<6;j++){
  ctx.beginPath();
  const rx=(185+j*20)*Math.min(innerWidth/950,innerHeight/850);
  const ry=rx*.24;
  const cy=innerHeight*.77;
  const cx=innerWidth/2;
  for(let i=0;i<=200;i++){
   const a=i/200*TAU;
   const xx=cx+Math.cos(a)*rx;
   const yy=cy+Math.sin(a)*ry;
   if(i===0)ctx.moveTo(xx,yy);
   else ctx.lineTo(xx,yy);
  }
  ctx.strokeStyle=j%2===0?
    "rgba(201,157,225,.30)":"rgba(220,205,238,.18)";
  ctx.lineWidth=1.1;
  ctx.shadowColor="#b88bd5";
  ctx.shadowBlur=8;
  ctx.stroke();
 }
 ctx.shadowBlur=0;

 // 树底暖金色光源
 const x=innerWidth/2,y=innerHeight*.73;
 const g=ctx.createRadialGradient(x,y,0,x,y,55);
 g.addColorStop(0,"rgba(255,215,170,.8)");
 g.addColorStop(.2,"rgba(226,156,194,.35)");
 g.addColorStop(1,"rgba(160,90,190,0)");
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(x,y,55,0,TAU);
 ctx.fill();
}

// 绘制螺旋光带
function drawSpiral(){
 const points=spiral.map(project);
 ctx.beginPath();
 points.forEach((p,i)=>{
  if(i===0)ctx.moveTo(p.x,p.y);
  else ctx.lineTo(p.x,p.y);
 });
 ctx.strokeStyle="rgba(219,177,242,.85)";
 ctx.lineWidth=1.5;
 ctx.shadowColor="#d5a5ed";
 ctx.shadowBlur=13;
 ctx.stroke();

 ctx.strokeStyle="rgba(255,255,255,.55)";
 ctx.lineWidth=.6;
 ctx.shadowBlur=5;
 ctx.stroke();
 ctx.shadowBlur=0;

 bulbs.forEach(b=>{
  const p=project(b);
  const flicker=.4+.6*Math.sin(time*2.5+b.phase);
  glow(p.x,p.y,b.size*p.k*1.5,
       "#f3d9ff",flicker);
 });
}

// 树粒子
function drawTree(){
 const sorted=particles.map(p=>({p,q:project(p)}))
   .sort((a,b)=>b.q.z-a.q.z);

 for(const item of sorted){
  const p=item.p,q=item.q;
  const flicker=.35+.65*
    Math.pow((Math.sin(time*p.speed+p.phase)+1)/2,2);
  const alpha=p.alpha*flicker;
  const r=Math.max(.35,p.size*q.k*1.3);

  glow(q.x,q.y,r,p.color,alpha);
 }
}

// 雪花持续下落
function drawSnow(){
 for(const s of snow){
  s.y+=s.speed*s.z*1.7;
  s.x+=s.drift+Math.sin(time+s.phase)*.35;

  if(s.y>innerHeight+10){
   s.y=-10;
   s.x=rand(0,innerWidth);
  }
  if(s.x<-10)s.x=innerWidth+10;
  if(s.x>innerWidth+10)s.x=-10;

  const r=s.size*s.z;
  const a=.3+.65*Math.sin(time*1.2+s.phase)**2;
  glow(s.x,s.y,r,"#e8dff5",a);
 }
}

// 星星位置
function drawTopStar(){
 const p=project({x:0,y:-505,z:0});
 drawStar(p.x,p.y,18);
}

// 动画
function animate(){
 requestAnimationFrame(animate);
 time+=.016;

 // 平滑环绕
 if(!dragging){
  targetYaw+=.0008;
 }
 yaw+=(targetYaw-yaw)*.08;
 pitch+=(targetPitch-pitch)*.08;
 pitch=Math.max(-.8,Math.min(.8,pitch));

 ctx.clearRect(0,0,innerWidth,innerHeight);
 ctx.fillStyle="#030205";
 ctx.fillRect(0,0,innerWidth,innerHeight);

 // 星空背景
 drawSnow();
 drawRings();
 drawTree();
 drawSpiral();
 drawTopStar();

 ctx.globalAlpha=1;
}
animate();

// 鼠标及触屏旋转
canvas.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;
 targetYaw+=dx*.008;
 targetPitch+=dy*.004;
 lastX=e.clientX;
 lastY=e.clientY;
});

canvas.addEventListener("pointerup",()=>{
 dragging=false;
});
canvas.addEventListener("pointercancel",()=>{
 dragging=false;
});

// 鼠标滚轮调整视角
canvas.addEventListener("wheel",e=>{
 targetPitch+=e.deltaY*.0003;
},{passive:true});

</script>
</body>
</html>
