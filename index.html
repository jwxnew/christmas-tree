
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 45%, #160827 0%, #080312 48%, #020106 100%);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#signature, #message {
    position: fixed;
    left: 50%;

    z-index: 10;

}

    bottom: 9%;

    font: italic clamp(27px, 4vw, 44px) Georgia, serif;

        0 0 8px #ffffff,
        0 0 22px #d9a8ff,
        0 0 45px #a34ce8;
}

#message {
    bottom: 3%;
    color: #e9cfff;
    font: italic clamp(19px, 2.7vw, 31px)
        "Brush Script MT", "Segoe Script", cursive;
    text-shadow:
        0 0 6px #ffffff,
        0 0 16px #d58bfa,
        0 0 32px #a34acb;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="signature">for YJL</div>
<div id="message">Merry Christmas</div>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { EffectComposer }
from "three/addons/postprocessing/EffectComposer.js";

import { RenderPass }
from "three/addons/postprocessing/RenderPass.js";

import { UnrealBloomPass }
from "three/addons/postprocessing/UnrealBloomPass.js";

import { OutputPass }
from "three/addons/postprocessing/OutputPass.js";


/* =========================================
   1. 基础场景
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03010a);

scene.fog = new THREE.FogExp2(0x03010a, 0.012);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.8)
);

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.25;

document.body.appendChild(renderer.domElement);


const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 3.2, 10.5);


/* =========================================
   2. 鼠标3D环绕控制
========================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.target.set(0, 2.5, 0);

controls.enableDamping = true;
controls.dampingFactor = 0.055;

controls.enablePan = false;

controls.enableZoom = true;

controls.minDistance = 7;
controls.maxDistance = 16;

controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.87;

controls.rotateSpeed = 0.65;

controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;


/* =========================================
   3. 灯光系统
========================================= */

scene.add(
    new THREE.AmbientLight(0xc9a8ff, 0.8)
);

const hemi = new THREE.HemisphereLight(
    0xe9dcff,
    0x170820,
    1.1
);

scene.add(hemi);

const light1 = new THREE.PointLight(
    0xd49aff, 32, 13
);

light1.position.set(0, 4.2, 2.5);
scene.add(light1);

const light2 = new THREE.PointLight(
    0xffffff, 18, 11
);

light2.position.set(-4, 5, 3);
scene.add(light2);

const light3 = new THREE.PointLight(
    0x9d50ed, 25, 12
);

light3.position.set(4, 2.5, -3);
scene.add(light3);


/* =========================================
   4. 辅助参数
========================================= */

const H = 5.4;
const R = 2.25;

const TAU = Math.PI * 2;

const rand = (a, b) => a + Math.random() * (b - a);

const treeGroup = new THREE.Group();

scene.add(treeGroup);

const clock = new THREE.Clock();

let elapsed = 0;


/* =========================================
   5. 创建柔和星云纹理
========================================= */

function createGlowTexture() {

    const canvas = document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const c = canvas.getContext("2d");

    const g = c.createRadialGradient(
        128, 128, 0,
        128, 128, 128
    );

    g.addColorStop(0, "rgba(255,255,255,0.9)");
    g.addColorStop(0.15, "rgba(225,170,255,0.55)");
    g.addColorStop(0.4, "rgba(157,82,220,0.2)");
    g.addColorStop(1, "rgba(100,30,160,0)");

    c.fillStyle = g;

    c.fillRect(0, 0, 256, 256);

    const texture = new THREE.CanvasTexture(canvas);

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

const glowTexture = createGlowTexture();


/* =========================================
   6. 背景星云
========================================= */

function addNebula(x, y, z, sx, sy, opacity) {

    const material = new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xb77be8,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const sprite = new THREE.Sprite(material);

    sprite.position.set(x, y, z);

    sprite.scale.set(sx, sy, 1);

    scene.add(sprite);

    return sprite;
}

addNebula(-4, 4, -8, 9, 7, 0.23);
addNebula(4, 3, -9, 8, 7, 0.18);
addNebula(0, 6, -12, 12, 8, 0.15);
addNebula(0, 1, -8, 7, 5, 0.12);


/* =========================================
   7. 星空粒子
========================================= */

const starPositions = [];
const starColors = [];

for (let i = 0; i < 650; i++) {

    starPositions.push(
        rand(-15, 15),
        rand(-4, 13),
        rand(-18, -9)
    );

    const color = new THREE.Color(
        Math.random() > 0.55 ? 0xf0dcff : 0xb990e8
    );

    starColors.push(
        color.r,
        color.g,
        color.b
    );
}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

starGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(starColors, 3)
);

const starMaterial = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

scene.add(
    new THREE.Points(starGeometry, starMaterial)
);


/* =========================================
   8. 树体半透明枝叶层
========================================= */

for (let level = 0; level < 8; level++) {

    const y0 = level * H / 8;

    const height = H / 7.2;

    const rBottom =
        R * Math.pow(1 - level / 8, 0.82);

    const rTop =
        Math.max(
            0.025,
            R * Math.pow(1 - (level + 1) / 8, 0.82) * 0.88
        );

    const geometry = new THREE.CylinderGeometry(
        rTop,
        rBottom,
        height,
        20,
        3,
        true
    );

    const material = new THREE.MeshPhysicalMaterial({
        color: 0x43195c,
        emissive: 0x37104e,
        emissiveIntensity: 0.55,
        transparent: true,
        opacity: 0.085,
        roughness: 0.65,
        metalness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: true
    });

    const layer = new THREE.Mesh(
        geometry,
        material
    );

    layer.position.y = y0 + height / 2;

    treeGroup.add(layer);
}


/* =========================================
   9. 树体粒子生成
========================================= */

const palette = [
    "#ffffff",
    "#f8efff",
    "#ead5ff",
    "#d5aaff",
    "#bd82ed",
    "#a969d9"
];

const bodyPoints = [];

for (let i = 0; i < 8500; i++) {

    const t = Math.random() * 0.985;

    const angle = rand(0, TAU);

    const maxR = R * Math.pow(1 - t, 0.78);

    let radial;

    if (Math.random() < 0.62) {

        radial = rand(0.76, 1.0);

    } else {

        radial = Math.sqrt(Math.random()) * 0.84;
    }

    const branchWave =
        0.93 +
        0.07 * Math.sin(angle * 12 + t * 44);

    const r = maxR * radial * branchWave;

    bodyPoints.push({
        x: r * Math.cos(angle),
        y: H * t + rand(-0.025, 0.025),
        z: r * Math.sin(angle),
        color: palette[
            Math.floor(Math.random() * palette.length)
        ]
    });
}


/* =========================================
   10. 分层枝条粒子
========================================= */

const branchPoints = [];

for (let level = 0; level < 8; level++) {

    const t = 0.10 + level * 0.112;

    const centerY = H * t;

    const radius =
        R * Math.pow(1 - t, 0.80) * 1.10;

    for (let branch = 0; branch < 16; branch++) {

        const angle =
            branch * TAU / 16 + level * 0.17;

        for (let j = 0; j < 34; j++) {

            const u = j / 33;

            const r = radius * (0.10 + 0.90 * u);

            const droop = 0.23 * u * u;

            branchPoints.push({

                x: r * Math.cos(angle) + rand(-0.035, 0.035),

                y: centerY - droop + rand(-0.035, 0.035),

                z: r * Math.sin(angle) + rand(-0.035, 0.035),

                color: Math.random() < 0.65
                    ? "#ffffff"
                    : "#dcb6ff"
            });
        }
    }
}


/* =========================================
   11. 粒子云生成器
========================================= */

function createPointCloud(points, size, opacity) {

    const positions = [];
    const colors = [];

    for (const p of points) {

        positions.push(p.x, p.y, p.z);

        const c = new THREE.Color(p.color);

        colors.push(c.r, c.g, c.b);
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
    );

    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(colors, 3)
    );

    const material = new THREE.PointsMaterial({

        size,

        vertexColors: true,

        transparent: true,

        opacity,

        depthWrite: false,

        sizeAttenuation: true,

        blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(
        geometry,
        material
    );

    treeGroup.add(particles);

    return particles;
}

createPointCloud(bodyPoints, 0.052, 0.90);

createPointCloud(branchPoints, 0.065, 0.92);


/* =========================================
   12. 树干
========================================= */

const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.17, 0.85, 12),
    new THREE.MeshStandardMaterial({
        color: 0x4c2452,
        roughness: 0.85
    })
);

trunk.position.y = 0.35;

treeGroup.add(trunk);


/* =========================================
   13. 圣诞装饰球
========================================= */

const ornamentGeometry = new THREE.SphereGeometry(
    1, 16, 12
);

const ornamentMaterials = [

    new THREE.MeshPhysicalMaterial({
        color: 0xf5eaff,
        metalness: 0.85,
        roughness: 0.16,
        clearcoat: 1,
        emissive: 0x8e55ad,
        emissiveIntensity: 0.5
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xb77be8,
        metalness: 0.72,
        roughness: 0.18,
        clearcoat: 1,
        emissive: 0x6e2ca0,
        emissiveIntensity: 0.65
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.92,
        roughness: 0.12,
        clearcoat: 1
    })
];

for (let i = 0; i < 38; i++) {

    const t = rand(0.12, 0.86);

    const maxR = R * Math.pow(1 - t, 0.78);

    const angle = rand(0, TAU);

    const radius = maxR * rand(0.87, 1.02);

    const size = rand(0.045, 0.085);

    const ornament = new THREE.Mesh(
        ornamentGeometry,
        ornamentMaterials[
            Math.floor(Math.random() * ornamentMaterials.length)
        ]
    );

    ornament.scale.setScalar(size);

    ornament.position.set(
        radius * Math.cos(angle),
        H * t,
        radius * Math.sin(angle)
    );

    treeGroup.add(ornament);
}


/* =========================================
   14. 树身螺旋灯带
========================================= */

const spiralPoints = [];

for (let i = 0; i <= 1000; i++) {

    const t = i / 1000;

    const angle = t * TAU * 5.2;

    const radius =
        R * 0.94 * Math.pow(1 - t, 0.83);

    spiralPoints.push(
        new THREE.Vector3(
            radius * Math.cos(angle),
            H * t,
            radius * Math.sin(angle)
        )
    );
}

const spiralCurve = new THREE.CatmullRomCurve3(
    spiralPoints
);

const spiralGeometry = new THREE.TubeGeometry(
    spiralCurve,
    1000,
    0.013,
    6,
    false
);

const spiralMaterial = new THREE.MeshBasicMaterial({
    color: 0xd9a5ff,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

treeGroup.add(
    new THREE.Mesh(spiralGeometry, spiralMaterial)
);

// 外层柔光
const spiralGlow = new THREE.Mesh(
    new THREE.TubeGeometry(
        spiralCurve,
        1000,
        0.038,
        6,
        false
    ),
    new THREE.MeshBasicMaterial({
        color: 0xa95de0,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

treeGroup.add(spiralGlow);


/* =========================================
   15. 螺旋灯珠
========================================= */

const bulbs = [];

const bulbGeometry = new THREE.SphereGeometry(
    0.026, 10, 8
);

for (let i = 0; i < 110; i++) {

    const t = i / 110;

    const p = spiralCurve.getPointAt(t);

    const material = new THREE.MeshStandardMaterial({

        color: 0xffffff,

        emissive: 0xdca9ff,

        emissiveIntensity: 1.8,

        metalness: 0.2,

        roughness: 0.2
    });

    const bulb = new THREE.Mesh(
        bulbGeometry,
        material
    );

    bulb.position.copy(p);

    treeGroup.add(bulb);

    bulbs.push({
        mesh: bulb,
        material,
        phase: rand(0, TAU)
    });
}


/* =========================================
   16. 树顶八角水晶星星
========================================= */

const starShape = new THREE.Shape();

for (let i = 0; i < 16; i++) {

    const angle = -Math.PI / 2 + i * Math.PI / 8;

    const radius = i % 2 === 0 ? 0.34 : 0.145;

    const x = Math.cos(angle) * radius;

    const y = Math.sin(angle) * radius;

    if (i === 0) {

        starShape.moveTo(x, y);

    } else {

        starShape.lineTo(x, y);
    }
}

starShape.closePath();

const starGeometry = new THREE.ExtrudeGeometry(
    starShape,
    {
        depth: 0.08,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
    }
);

const starMaterial = new THREE.MeshPhysicalMaterial({

    color: 0xffffff,

    metalness: 0.55,

    roughness: 0.12,

    clearcoat: 1,

    emissive: 0xdcb0ff,

    emissiveIntensity: 2.1
});

const starGroup = new THREE.Group();

starGroup.position.set(0, H + 0.36, 0);

treeGroup.add(starGroup);

const starMesh = new THREE.Mesh(
    starGeometry,
    starMaterial
);

starGroup.add(starMesh);

// 水晶切面线
const edgeGeometry = new THREE.EdgesGeometry(starGeometry);

const starEdges = new THREE.LineSegments(
    edgeGeometry,
    new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.85
    })
);

starMesh.add(starEdges);

// 星星周围柔光
const starHalo = new THREE.Sprite(
    new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xe2b5ff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

starHalo.scale.set(1.35, 1.35, 1);

starGroup.add(starHalo);


/* =========================================
   17. 地面光晕
========================================= */

const floorGlow = new THREE.Mesh(
    new THREE.CircleGeometry(3.0, 80),
    new THREE.MeshBasicMaterial({
        map: glowTexture,
        color: 0xc58bff,
        transparent: true,
        opacity: 0.30,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
    })
);

floorGlow.rotation.x = -Math.PI / 2;

floorGlow.position.y = 0.025;

treeGroup.add(floorGlow);


/* =========================================
   18. 地面环形光轨
========================================= */

const baseRings = [];

[2.55, 3.15, 3.85].forEach((radius, i) => {

    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
            radius,
            0.009,
            6,
            220
        ),
        new THREE.MeshBasicMaterial({
            color: i === 1 ? 0xe0b7ff : 0xa96de2,
            transparent: true,
            opacity: 0.28,
            blending: THREE.AdditiveBlending
        })
    );

    ring.rotation.x = Math.PI / 2;

    ring.position.y = 0.04 + i * 0.012;

    treeGroup.add(ring);

    baseRings.push(ring);
});


/* =========================================
   19. 创建真正的3D环绕轨道
========================================= */

const orbitSpecs = [

    {
        y: H * 0.25,
        rx: 2.65,
        rz: 2.15,
        tiltX: 0.45,
        tiltZ: -0.18,
        wave: 0.12,
        phase: 0.2,
        color: 0xe4b5ff,
        speed: 0.70
    },

    {
        y: H * 0.48,
        rx: 2.35,
        rz: 2.75,
        tiltX: -0.52,
        tiltZ: 0.20,
        wave: 0.16,
        phase: 1.5,
        color: 0xffffff,
        speed: -0.55
    },

    {
        y: H * 0.70,
        rx: 1.60,
        rz: 1.95,
        tiltX: 0.32,
        tiltZ: 0.38,
        wave: 0.10,
        phase: 2.4,
        color: 0xd5a1ff,
        speed: 0.82
    },

    {
        y: H * 0.39,
        rx: 2.90,
        rz: 2.40,
        tiltX: -0.25,
        tiltZ: -0.42,
        wave: 0.18,
        phase: 3.1,
        color: 0xe9caff,
        speed: -0.36
    }

];

const orbitSystems = [];


function createOrbit(spec) {

    const group = new THREE.Group();

    group.position.y = spec.y;

    group.rotation.set(
        spec.tiltX,
        0,
        spec.tiltZ
    );

    treeGroup.add(group);

    const points = [];

    for (let i = 0; i < 360; i++) {

        const a = i / 360 * TAU;

        points.push(
            new THREE.Vector3(
                spec.rx * Math.cos(a),
                Math.sin(a * 2 + spec.phase) * spec.wave,
                spec.rz * Math.sin(a)
            )
        );
    }

    const curve = new THREE.CatmullRomCurve3(
        points,
        true,
        "centripetal"
    );

    // 外层光晕
    const glowTube = new THREE.Mesh(
        new THREE.TubeGeometry(
            curve,
            600,
            0.043,
            6,
            true
        ),
        new THREE.MeshBasicMaterial({
            color: spec.color,
            transparent: true,
            opacity: 0.16,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    group.add(glowTube);

    // 内层光带
    const coreTube = new THREE.Mesh(
        new THREE.TubeGeometry(
            curve,
            600,
            0.012,
            6,
            true
        ),
        new THREE.MeshBasicMaterial({
            color: spec.color,
            transparent: true,
            opacity: 0.78,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    group.add(coreTube);

    // 环绕小光珠
    const beads = [];

    const beadGeometry = new THREE.SphereGeometry(
        0.025, 8, 8
    );

    const beadMaterial = new THREE.MeshStandardMaterial({
        color: spec.color,
        emissive: spec.color,
        emissiveIntensity: 2.0,
        roughness: 0.2
    });

    for (let i = 0; i < 22; i++) {

        const bead = new THREE.Mesh(
            beadGeometry,
            beadMaterial
        );

        group.add(bead);

        beads.push(bead);
    }

    // 彗星头部
    const cometMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

    const comet = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 12, 12),
        cometMaterial
    );

    group.add(comet);

    // 彗星拖尾
    const tail = [];

    for (let i = 0; i < 9; i++) {

        const material = new THREE.MeshBasicMaterial({
            color: spec.color,
            transparent: true,
            opacity: 0.65 * (1 - i / 10),
            blending: THREE.AdditiveBlending
        });

        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(
                0.045 * (1 - i / 13),
                8,
                8
            ),
            material
        );

        group.add(particle);

        tail.push(particle);
    }

    orbitSystems.push({
        group,
        curve,
        beads,
        comet,
        tail,
        speed: spec.speed,
        phase: spec.phase
    });
}

orbitSpecs.forEach(createOrbit);


/* =========================================
   20. 雪花系统
   远景120片，近景40片
========================================= */

function createSnow(count, zMin, zMax, size, opacity) {

    const positions = [];

    const speeds = [];
    const drifts = [];
    const phases = [];

    for (let i = 0; i < count; i++) {

        positions.push(
            rand(-6, 6),
            rand(-0.5, 7.5),
            rand(zMin, zMax)
        );

        speeds.push(rand(0.28, 0.85));

        drifts.push(rand(-0.25, 0.25));

        phases.push(rand(0, TAU));
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({

        color: 0xf6eaff,

        size,

        transparent: true,

        opacity,

        depthWrite: false,

        sizeAttenuation: true,

        blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(
        geometry,
        material
    );

    scene.add(points);

    return {
        geometry,
        points,
        speeds,
        drifts,
        phases,
        positions,
        count
    };
}

const farSnow = createSnow(
    120,
    -7,
    -3.5,
    0.035,
    0.48
);

const nearSnow = createSnow(
    40,
    3,
    5.5,
    0.075,
    0.72
);


/* =========================================
   21. 雪花运动
========================================= */

function updateSnow(snow, dt) {

    const p = snow.positions;

    for (let i = 0; i < snow.count; i++) {

        const index = i * 3;

        p[index + 1] -= snow.speeds[i] * dt;

        p[index] += (
            snow.drifts[i] +
            Math.sin(elapsed * 1.2 + snow.phases[i]) * 0.08
        ) * dt;

        if (p[index + 1] < -0.8) {

            p[index + 1] = 7.8;

            p[index] = rand(-6, 6);
        }

        if (p[index] > 6.5) p[index] = -6.5;

        if (p[index] < -6.5) p[index] = 6.5;
    }

    snow.geometry.attributes.position.needsUpdate = true;
}


/* =========================================
   22. 更新螺旋灯珠
========================================= */

function updateBulbs() {

    for (const b of bulbs) {

        const f =
            0.5 +
            0.5 * Math.sin(elapsed * 2.8 + b.phase);

        b.material.emissiveIntensity = 0.7 + f * 2.3;

        b.mesh.scale.setScalar(0.75 + f * 0.55);
    }
}


/* =========================================
   23. 更新环绕粒子和彗星
========================================= */

function updateOrbits() {

    for (const system of orbitSystems) {

        const t = (
            elapsed * system.speed * 0.055 +
            system.phase / TAU
        ) % 1;

        const normalizedT = (t + 1) % 1;

        // 环绕光珠
        system.beads.forEach((bead, i) => {

            const beadT = (
                normalizedT + i / system.beads.length
            ) % 1;

            bead.position.copy(
                system.curve.getPointAt(beadT)
            );

            const pulse =
                0.65 +
                0.35 * Math.sin(elapsed * 2 + i);

            bead.scale.setScalar(pulse);
        });

        // 彗星头部
        system.comet.position.copy(
            system.curve.getPointAt(normalizedT)
        );

        // 彗星拖尾
        system.tail.forEach((particle, i) => {

            const tailT = (
                normalizedT - (i + 1) * 0.007 + 1
            ) % 1;

            particle.position.copy(
                system.curve.getPointAt(tailT)
            );
        });
    }
}


/* =========================================
   24. 星星闪烁
========================================= */

function updateStar() {

    starGroup.rotation.y =
        Math.sin(elapsed * 0.6) * 0.12;

    const pulse =
        1 + 0.06 * Math.sin(elapsed * 2.4);

    starMesh.scale.setScalar(pulse);

    starMaterial.emissiveIntensity =
        1.5 + 1.2 * (
            0.5 + 0.5 * Math.sin(elapsed * 2.4)
        );

    starHalo.material.opacity =
        0.55 + 0.35 * (
            0.5 + 0.5 * Math.sin(elapsed * 2.0)
        );
}


/* =========================================
   25. 后期辉光效果
========================================= */

const composer = new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene, camera)
);

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),
    1.25,
    0.70,
    0.12
);

composer.addPass(bloomPass);

composer.addPass(new OutputPass());


/* =========================================
   26. 窗口尺寸变化
========================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.8)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    composer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    bloomPass.setSize(
        window.innerWidth,
        window.innerHeight
    );
});


/* =========================================
   27. 主动画
========================================= */

function animate() {

    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.04);

    elapsed += dt;

    // 控制器
    controls.update();

    // 树身灯珠
    updateBulbs();

    // 环绕粒子
    updateOrbits();

    // 树顶星星
    updateStar();

    // 雪花
    updateSnow(farSnow, dt);

    updateSnow(nearSnow, dt);

    // 地面光环缓慢旋转
    baseRings.forEach((ring, i) => {

        ring.rotation.y =
            Math.sin(elapsed * 0.15 + i) * 0.08;
    });

    // 光照轻微呼吸
    light1.intensity =
        27 + 6 * Math.sin(elapsed * 0.8);

    // 渲染
    composer.render();
}

animate();


</script>
