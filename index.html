<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b}
#scene{position:fixed;inset:0}
canvas{display:block}
#dedication{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:2;
 color:#eafaff;font:italic clamp(25px,4vw,46px) Georgia,serif;letter-spacing:.08em;
 white-space:nowrap;pointer-events:none;text-shadow:0 0 7px #bdefff,0 0 20px #5bcfff}
</style>
</head>
<body>
<div id="scene"></div><div id="dedication">for yjl</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const host=document.querySelector("#scene");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02050b);
scene.fog=new THREE.FogExp2(0x02050b,.012);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(9,7.3,14);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.85;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.target.set(0,3.8,0);controls.minDistance=5.5;controls.maxDistance=25;
controls.minPolarAngle=.12;controls.maxPolarAngle=Math.PI*.49;
controls.rotateSpeed=.72;controls.zoomSpeed=.8;

scene.add(new THREE.AmbientLight(0xc9e6f4,.7));
const key=new THREE.PointLight(0x9bdfff,22,25,2);key.position.set(4,8,5);scene.add(key);
const fill=new THREE.PointLight(0xffffff,9,20,2);fill.position.set(-5,5,-4);scene.add(fill);

const tree=new THREE.Group();scene.add(tree);
const H=7.8,R=2.35;
const radius=y=>R*Math.pow(Math.max(0,1-y/H),.9);

// Fine, restrained particles: standard alpha blending prevents white overexposure.
const count=11500, pos=new Float32Array(count*3), sizes=new Float32Array(count), phases=new Float32Array(count);
for(let i=0;i<count;i++){
 const y=Math.random()*H, maxR=radius(y);
 const r=maxR*(.48+.52*Math.sqrt(Math.random()));
 const a=Math.random()*Math.PI*2,j=i*3;
 pos[j]=Math.cos(a)*r;pos[j+1]=y;pos[j+2]=Math.sin(a)*r;
 sizes[i]=.55+Math.random()*.95;phases[i]=Math.random()*Math.PI*2;
}
const bodyGeo=new THREE.BufferGeometry();
bodyGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
bodyGeo.setAttribute("aSize",new THREE.BufferAttribute(sizes,1));
bodyGeo.setAttribute("aPhase",new THREE.BufferAttribute(phases,1));
const bodyMat=new THREE.ShaderMaterial({
 uniforms:{uTime:{value:0}},
 vertexShader:`
 attribute float aSize;attribute float aPhase;uniform float uTime;
 varying float vPulse;
 void main(){
  float pulse=.58+.42*(.5+.5*sin(uTime*2.0+aPhase));
  vec4 mv=modelViewMatrix*vec4(position,1.);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=aSize*(1.0+.45*pulse)*(180.0/max(1.0,-mv.z));
  vPulse=pulse;
 }`,
 fragmentShader:`
 varying float vPulse;
 void main(){
  vec2 p=gl_PointCoord-.5;float d=length(p);
  if(d>.5)discard;
  float edge=smoothstep(.5,.08,d);
  gl_FragColor=vec4(vec3(.72,.86,.96),edge*(.22+.48*vPulse));
 }`,
 transparent:true,depthWrite:false,blending:THREE.NormalBlending
});
tree.add(new THREE.Points(bodyGeo,bodyMat));

// Scattered brighter twinkles, deliberately sparse.
const twinkles=[];
const dotGeo=new THREE.SphereGeometry(.018,7,7);
for(let i=0;i<270;i++){
 const y=.18+Math.random()*(H-.3),r=radius(y)*(.76+Math.random()*.2),a=Math.random()*Math.PI*2;
 const m=new THREE.Mesh(dotGeo,new THREE.MeshBasicMaterial({color:0xc9f2ff,transparent:true,opacity:.2}));
 m.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
 m.userData={phase:Math.random()*6.28,base:.22+Math.random()*.55};
 tree.add(m);twinkles.push(m);
}

// Spiral ribbon with a thin bright core and restrained blue aura.
const curvePts=[],turns=6.2;
for(let i=0;i<=1000;i++){
 const u=i/1000,y=.12+u*(H-.18),a=u*turns*Math.PI*2,r=radius(y)*1.045;
 curvePts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));
}
const spiral=new THREE.CatmullRomCurve3(curvePts);
function tube(rad,color,opacity){
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(spiral,1000,rad,7,false),
 new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false}));
 tree.add(mesh);
}
tube(.052,0x55cfff,.12);tube(.021,0xa9eaff,.48);tube(.008,0xf2fcff,.92);

// Fine points along the spiral.
const beadPos=[];
for(let i=0;i<115;i++){const p=spiral.getPoint(i/115);beadPos.push(p.x,p.y,p.z)}
const beadGeo=new THREE.BufferGeometry();beadGeo.setAttribute("position",new THREE.Float32BufferAttribute(beadPos,3));
tree.add(new THREE.Points(beadGeo,new THREE.PointsMaterial({color:0xdff8ff,size:.035,transparent:true,opacity:.75,depthWrite:false})));

// Icy star topper.
const topper=new THREE.Group();topper.position.y=H+.58;tree.add(topper);
const shape=new THREE.Shape();
for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2===0?.27:.115,x=Math.cos(a)*r,y=Math.sin(a)*r;i?shape.lineTo(x,y):shape.moveTo(x,y)}
shape.closePath();
const star=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshBasicMaterial({color:0xf5fdff,side:THREE.DoubleSide}));
topper.add(star);
const starGlow=new THREE.PointLight(0x8edfff,3.5,3);topper.add(starGlow);

// Base rings.
const base=new THREE.Group();base.position.y=-.08;tree.add(base);
[2.48,2.85,3.22,3.6,3.98].forEach((r,i)=>{
 const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.009,6,220),
 new THREE.MeshBasicMaterial({color:0xa9eaff,transparent:true,opacity:.28-i*.025}));
 ring.rotation.x=Math.PI/2;base.add(ring);
});

// Distant star field.
const skyN=620,skyPos=new Float32Array(skyN*3);
for(let i=0;i<skyN;i++){
 const a=Math.random()*Math.PI*2,r=11+Math.random()*16,j=i*3;
 skyPos[j]=Math.cos(a)*r;skyPos[j+1]=Math.random()*17-1;skyPos[j+2]=Math.sin(a)*r;
}
const skyGeo=new THREE.BufferGeometry();skyGeo.setAttribute("position",new THREE.BufferAttribute(skyPos,3));
scene.add(new THREE.Points(skyGeo,new THREE.PointsMaterial({color:0xc8dbe8,size:.025,transparent:true,opacity:.58,depthWrite:false})));

// Snowfall: varied particle sizes and gentle sideways drift.
const N=850,snowPos=new Float32Array(N*3),speed=new Float32Array(N),drift=new Float32Array(N),snowSizes=new Float32Array(N);
for(let i=0;i<N;i++){
 const j=i*3;snowPos[j]=(Math.random()-.5)*15;snowPos[j+1]=Math.random()*15-1;snowPos[j+2]=(Math.random()-.5)*15;
 speed[i]=.8+Math.random()*1.8;drift[i]=.15+Math.random()*.65;snowSizes[i]=.7+Math.random()*1.8;
}
const snowGeo=new THREE.BufferGeometry();snowGeo.setAttribute("position",new THREE.BufferAttribute(snowPos,3));
snowGeo.setAttribute("aSize",new THREE.BufferAttribute(snowSizes,1));
const snowMat=new THREE.ShaderMaterial({
 vertexShader:`attribute float aSize;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=aSize*(100.0/max(1.0,-mv.z));}`,
 fragmentShader:`void main(){vec2 p=gl_PointCoord-.5;float d=length(p);if(d>.5)discard;float a=1.-smoothstep(.15,.5,d);gl_FragColor=vec4(.88,.96,1.,a*.78);}`,
 transparent:true,depthWrite:false
});
scene.add(new THREE.Points(snowGeo,snowMat));

// Larger, softer flakes.
const bigN=75,bigPos=new Float32Array(bigN*3),bigSpeed=new Float32Array(bigN);
for(let i=0;i<bigN;i++){const j=i*3;bigPos[j]=(Math.random()-.5)*13;bigPos[j+1]=Math.random()*15-1;bigPos[j+2]=(Math.random()-.5)*13;bigSpeed[i]=.45+Math.random()*1.0}
const bigGeo=new THREE.BufferGeometry();bigGeo.setAttribute("position",new THREE.BufferAttribute(bigPos,3));
scene.add(new THREE.Points(bigGeo,new THREE.PointsMaterial({color:0xeaf8ff,size:.075,transparent:true,opacity:.55,depthWrite:false})));

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 bodyMat.uniforms.uTime.value=t;
 tree.rotation.y+=dt*.10;base.rotation.y-=dt*.025;
 topper.scale.setScalar(1+.045*Math.sin(t*2.1));
 twinkles.forEach(m=>{const p=.5+.5*Math.sin(t*2.8+m.userData.phase);m.material.opacity=m.userData.base*(.25+.75*p);m.scale.setScalar(.7+.5*p)});
 let p=snowGeo.attributes.position.array;
 for(let i=0;i<N;i++){const j=i*3;p[j+1]-=speed[i]*dt;p[j]+=Math.sin(t*.8+i)*drift[i]*dt*.22;p[j+2]+=Math.cos(t*.55+i)*drift[i]*dt*.12;if(p[j+1]<-1.5){p[j+1]=13+Math.random()*3;p[j]=(Math.random()-.5)*15;p[j+2]=(Math.random()-.5)*15}}
 snowGeo.attributes.position.needsUpdate=true;
 p=bigGeo.attributes.position.array;
 for(let i=0;i<bigN;i++){const j=i*3;p[j+1]-=bigSpeed[i]*dt;p[j]+=Math.sin(t*.5+i)*dt*.2;if(p[j+1]<-1.5){p[j+1]=13+Math.random()*3;p[j]=(Math.random()-.5)*13;p[j+2]=(Math.random()-.5)*13}}
 bigGeo.attributes.position.needsUpdate=true;
 controls.update();renderer.render(scene,camera);
}
animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body>
</html>
