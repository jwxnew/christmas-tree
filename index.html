
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;
 overflow:hidden;background:#020104;
}
canvas{
 position:fixed;inset:0;
 width:100%;height:100%;
 cursor:grab;touch-action:none;
}
canvas:active{cursor:grabbing}
#message{
 position:fixed;
 left:clamp(18px,5vw,85px);
 top:52%;
 transform:translateY(-50%);
 color:#f4dfff;
 font:italic clamp(22px,3vw,36px)
 "Brush Script MT","Segoe Script",cursive;
 text-shadow:0 0 5px white,0 0 13px #d58bfa,
 0 0 28px #a34acb;
 white-space:nowrap;
 pointer-events:none;
}
#signature{
 position:fixed;bottom:4%;
 left:50%;transform:translateX(-50%);
 color:#f5eaff;
 font:italic clamp(22px,3vw,38px) Georgia,serif;
 letter-spacing:.12em;
 text-shadow:0 0 8px white,0 0 20px #c38bdf;
 pointer-events:none;
}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="message">Merry Christmas</div>
<div id="signature">for YJL</div>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");

let W,H,D;
let yaw=-0.25,pitch=0.28;
let targetYaw=yaw,targetPitch=pitch;
let zoom=1;
let dragging=false,lastX=0,lastY=0;
let time=0;

const TREE_H=290;
const BASE_R=85;
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
resize();

function scale(){
 return Math.min(W/700,H/760)*.95*zoom;
}

// 粒子树主体：只分布在树体外层
const tree=[];

for(let i=0;i<2700;i++){
 const t=Math.pow(Math.random(),.78);
 const radius=BASE_R*Math.pow(1-t,.86);
 const r=radius*rand(.70,1.0);
 const a=rand(0,TAU);

 tree.push({
  x:r*Math.cos(a),
  y:-t*TREE_H+rand(-4,4),
  z:r*Math.sin(a),
  size:rand(.35,1.45),
  phase:rand(0,TAU),
  speed:rand(.7,2.4),
  color:Math.random()<.66?"#f4edff":
        Math.random()<.55?"#d9b2f6":"#b77ad8"
 });
}

// 树枝：分层向外延伸，形成自然树形
for(let level=0;level<8;level++){
 const t=(level+.5)/8.5;
 const radius=BASE_R*Math.pow(1-t,.86);

 for(let branch=0;branch<10;branch++){
  const angle=branch*TAU/10+level*.24;

  for(let j=0;j<17;j++){
   const u=j/16;
   const r=radius*u;
   const a=angle+u*.16;

   tree.push({
    x:r*Math.cos(a),
    y:-t*TREE_H+u*17+rand(-2,2),
    z:r*Math.sin(a),
    size:rand(.45,1.5),
    phase:rand(0,TAU),
    speed:rand(.7,2.3),
    color:Math.random()<.7?"#ffffff":"#d6a5f0"
   });
  }
 }
}

// 树身螺旋灯带
const spiral=[];
for(let i=0;i<=700;i++){
 const t=i/700;
 const a=t*TAU*4.5;
 const r=BASE_R*Math.pow(1-t,.88);

 spiral.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a)
 });
}

// 螺旋灯珠
const bulbs=[];
for(let i=0;i<145;i++){
 const t=i/145;
 const a=t*TAU*4.5;
 const r=BASE_R*Math.pow(1-t,.88);

 bulbs.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a),
  phase:rand(0,TAU),
  size:rand(1,2.5)
 });
}

// 树顶额外闪烁星点
const glitters=[];
for(let i=0;i<130;i++){
 const t=rand(.05,.98);
 const r=BASE_R*Math.pow(1-t,.86)*rand(.7,1.1);
 const a=rand(0,TAU);
 glitters.push({
  x:r*Math.cos(a),
  y:-t*TREE_H,
  z:r*Math.sin(a),
  phase:rand(0,TAU),
  size:rand(1,3)
 });
}

// 星空
const stars=[];
for(let i=0;i<420;i++){
 stars.push({
  x:rand(0,1),
  y:rand(0,1),
  size:rand(.3,1.3),
  phase:rand(0,TAU)
 });
}

// 飘落雪花
const snow=[];
for(let i=0;i<300;i++){
 snow.push({
  x:rand(0,W),
  y:rand(0,H),
  size:rand(.4,1.8),
  speed:rand(.35,1.6),
  drift:rand(-.4,.4),
  phase:rand(0,TAU)
 });
}

// 地面银河粒子
const ground=[];
for(let i=0;i<1500;i++){
 const a=rand(0,TAU);
 const r=BASE_R*rand(1.0,4.3);

 ground.push({
  x:r*Math.cos(a),
  y:rand(-1,1),
  z:r*Math.sin(a),
  size:rand(.35,1.3),
  phase:rand(0,TAU)
 });
}

// 3D透视投影
function project(p){
 const s=scale();

 const x1=p.x*Math.cos(yaw)-p.z*Math.sin(yaw);
 const z1=p.x*Math.sin(yaw)+p.z*Math.cos(yaw);

 const y1=p.y*Math.cos(pitch)-z1*Math.sin(pitch);
 const z2=p.y*Math.sin(pitch)+z1*Math.cos(pitch);

 const focal=1100;
 const k=focal/(focal+z2);

 return {
  x:W/2+x1*s*k,
  y:H*.70+y1*s*k,
  z:z2,
  k
 };
}

// 发光粒子
function dot(x,y,r,color,alpha,glow=false){
 ctx.globalAlpha=alpha;
 ctx.fillStyle=color;

 if(glow){
  ctx.shadowColor=color;
  ctx.shadowBlur=9;
 }

 ctx.beginPath();
 ctx.arc(x,y,Math.max(.25,r),0,TAU);
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.globalAlpha=1;
}

// 背景星空
function drawStars(){
 for(const s of stars){
  const a=.2+.6*(.5+.5*Math.sin(time*1.4+s.phase));
  dot(s.x*W,s.y*H,s.size,"#d9c9e8",a);
 }
}

// 雪花下落
function drawSnow(){
 for(const s of snow){
  s.y+=s.speed;
  s.x+=s.drift+Math.sin(time+s.phase)*.25;

  if(s.y>H+5){
   s.y=-5;
   s.x=rand(0,W);
  }

  if(s.x<0)s.x=W;
  if(s.x>W)s.x=0;

  const a=.25+.65*(.5+.5*Math.sin(time+s.phase));
  dot(s.x,s.y,s.size,"#f4eaff",a,s.size>1.4);
 }
}

// 绘制地面光环
function drawRings(){
 const s=scale();
 const radii=[1.35,1.8,2.35,2.9,3.5,4.1];

 for(let j=0;j<radii.length;j++){
  const r=BASE_R*radii[j];
  const points=[];

  for(let i=0;i<=240;i++){
   const a=i/240*TAU;
   points.push(project({
    x:r*Math.cos(a),y:0,
    z:r*Math.sin(a)
   }));
  }

  ctx.beginPath();
  points.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  });

  ctx.strokeStyle=j%2===0?
   "rgba(185,117,225,.35)":
   "rgba(223,193,245,.22)";
  ctx.lineWidth=1.1*s;
  ctx.shadowColor="#bd76e7";
  ctx.shadowBlur=9;
  ctx.stroke();
  ctx.shadowBlur=0;
 }

 // 银河地面粒子
 for(const g of ground){
  const p=project(g);
  const a=.2+.6*Math.pow(
   .5+.5*Math.sin(time*1.2+g.phase),2
  );
  dot(p.x,p.y,g.size*p.k,
      "#cda0e8",a,g.size>1);
 }
}

// 树体粒子
function drawTree(){
 const list=tree.map(p=>({p,q:project(p)}));
 list.sort((a,b)=>b.q.z-a.q.z);

 for(const item of list){
  const p=item.p,q=item.q;

  const flicker=.25+.75*Math.pow(
   .5+.5*Math.sin(time*p.speed+p.phase),3
  );

  const alpha=flicker*(.6+.4*q.k);
  const r=p.size*q.k*scale()*.9;

  dot(q.x,q.y,r,p.color,alpha,r>1.1);
 }
}

// 螺旋灯带
function drawSpiral(){
 const points=spiral.map(project);

 ctx.beginPath();
 points.forEach((p,i)=>{
  if(i===0)ctx.moveTo(p.x,p.y);
  else ctx.lineTo(p.x,p.y);
 });

 ctx.strokeStyle="rgba(215,166,244,.8)";
 ctx.lineWidth=1.3*scale();
 ctx.shadowColor="#d99cff";
 ctx.shadowBlur=13;
 ctx.stroke();

 ctx.strokeStyle="rgba(255,244,255,.55)";
 ctx.lineWidth=.55*scale();
 ctx.shadowBlur=5;
 ctx.stroke();
 ctx.shadowBlur=0;

 // 灯珠明暗变化
 for(const b of bulbs){
  const p=project(b);
  const f=.15+.85*(
   .5+.5*Math.sin(time*2.7+b.phase)
  );
  dot(p.x,p.y,b.size*p.k*scale(),
      "#f5d9ff",f,true);
 }

 // 独立闪烁的星光
 for(const g of glitters){
  const p=project(g);
  const f=Math.pow(
   .5+.5*Math.sin(time*2+g.phase),5
  );
  dot(p.x,p.y,g.size*p.k*scale(),
      "#fffaff",f,true);
 }
}

// 树顶水晶星星
function drawTopStar(){

 const p=project({
  x:0,
  y:-TREE_H-22,
  z:0
 });

 const s=scale();

 // 呼吸闪烁
 const pulse=1+0.08*Math.sin(time*2.2);

 // 星星整体尺寸
 const h=16*s*pulse;
 const w=7.5*s*pulse;

 ctx.save();
 ctx.translate(p.x,p.y);

 // 1. 外层柔光
 const glow=ctx.createRadialGradient(
  0,0,0,0,0,h*2.8
 );

 glow.addColorStop(0,"rgba(255,255,255,0.95)");
 glow.addColorStop(0.2,"rgba(245,230,255,0.55)");
 glow.addColorStop(0.45,"rgba(210,170,255,0.22)");
 glow.addColorStop(1,"rgba(180,120,255,0)");

 ctx.fillStyle=glow;

 ctx.beginPath();
 ctx.arc(0,0,h*2.8,0,TAU);
 ctx.fill();

 // 2. 水晶钻石主体
 ctx.shadowColor="#ffffff";
 ctx.shadowBlur=20;

 const crystal=ctx.createLinearGradient(
  -w,-h,w,h*1.2
 );

 crystal.addColorStop(0,"rgba(255,255,255,0.98)");
 crystal.addColorStop(0.35,"rgba(240,225,255,0.95)");
 crystal.addColorStop(0.7,"rgba(210,185,255,0.9)");
 crystal.addColorStop(1,"rgba(255,255,255,0.98)");

 ctx.fillStyle=crystal;

 ctx.beginPath();
 ctx.moveTo(0,-h);
 ctx.lineTo(w,0);
 ctx.lineTo(0,h*1.25);
 ctx.lineTo(-w,0);
 ctx.closePath();
 ctx.fill();

 // 3. 内部水晶切面
 ctx.shadowBlur=0;

 ctx.strokeStyle="rgba(255,255,255,0.75)";
 ctx.lineWidth=Math.max(0.8,1.1*s);

 // 中轴线
 ctx.beginPath();
 ctx.moveTo(0,-h);
 ctx.lineTo(0,h*1.25);
 ctx.stroke();

 // 左右切面
 ctx.beginPath();
 ctx.moveTo(0,-h*0.05);
 ctx.lineTo(-w*0.82,0);
 ctx.lineTo(0,h*0.62);
 ctx.lineTo(w*0.82,0);
 ctx.closePath();
 ctx.stroke();

 // 4. 顶部和底部高光
 ctx.fillStyle="#ffffff";

 ctx.beginPath();
 ctx.arc(0,-h,1.9*s,0,TAU);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,h*1.25,1.6*s,0,TAU);
 ctx.fill();

 // 5. 周围十字闪光
 function sparkle(x,y,r,alpha){

  ctx.save();
  ctx.translate(x,y);
  ctx.globalAlpha=alpha;

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=Math.max(0.8,1*s);
  ctx.shadowColor="#ffffff";
  ctx.shadowBlur=8;

  ctx.beginPath();

  ctx.moveTo(-r,0);
  ctx.lineTo(r,0);

  ctx.moveTo(0,-r);
  ctx.lineTo(0,r);

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(-r*0.6,-r*0.6);
  ctx.lineTo(r*0.6,r*0.6);

  ctx.moveTo(r*0.6,-r*0.6);
  ctx.lineTo(-r*0.6,r*0.6);

  ctx.stroke();

  ctx.restore();
 }

 const tw=0.55+0.45*Math.sin(time*3.2);

 sparkle(
  -w*1.45,
  -h*0.15,
  3.4*s,
  0.35+0.35*tw
 );

 sparkle(
  w*1.55,
  h*0.05,
  2.8*s,
  0.28+0.28*tw
 );

 sparkle(
  0,
  -h*1.45,
  2.5*s,
  0.22+0.25*tw
 );

 ctx.restore();
}

// 树底暖金色光芒
function drawBaseGlow(){

 const x=W/2;
 const y=H*.70;
 const s=scale();

 const g=ctx.createRadialGradient(
  x,y,0,x,y,55*s
 );

 g.addColorStop(0,"rgba(255,211,164,.75)");
 g.addColorStop(.18,"rgba(225,153,220,.38)");
 g.addColorStop(.5,"rgba(166,99,213,.12)");
 g.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=g;

 ctx.beginPath();
 ctx.arc(x,y,55*s,0,TAU);
 ctx.fill();
}

// 主动画
function animate(){

 requestAnimationFrame(animate);

 time+=.016;

 if(!dragging)targetYaw+=.0008;

 yaw+=(targetYaw-yaw)*.08;
 pitch+=(targetPitch-pitch)*.08;

 pitch=clamp(pitch,.08,1.05);

 ctx.clearRect(0,0,W,H);

 ctx.fillStyle="#020104";
 ctx.fillRect(0,0,W,H);

 drawStars();
 drawSnow();
 drawRings();
 drawBaseGlow();
 drawTree();
 drawSpiral();
 drawTopStar();
}

animate();

// 鼠标拖动旋转
canvas.addEventListener("pointerdown",e=>{

 dragging=true;

 lastX=e.clientX;
 lastY=e.clientY;

 canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove",e=>{

 if(!dragging)return;

 targetYaw+=(e.clientX-lastX)*.007;
 targetPitch+=(e.clientY-lastY)*.004;

 lastX=e.clientX;
 lastY=e.clientY;

});

function stopDrag(){
 dragging=false;
}

canvas.addEventListener("pointerup",stopDrag);
canvas.addEventListener("pointercancel",stopDrag);

// 滚轮改变观察角度
canvas.addEventListener("wheel",e=>{

 targetPitch=clamp(
  targetPitch+e.deltaY*.0004,
  .08,
  1.05
 );

},{passive:true});

</script>
</body>
</html>
