
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03010a;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    z-index: 0;
}

canvas:active {
    cursor: grabbing;
}

#signature, #message {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
}

#signature {
    bottom: 8%;
    color: #fff5ff;
    font: italic clamp(28px, 4vw, 46px) Georgia, serif;
    letter-spacing: .16em;
    text-shadow:
        0 0 8px #ffffff,
        0 0 20px #e1b5ff,
        0 0 42px #a34ce8;
}

#message {
    bottom: 2.5%;
    color: #e9cfff;
    font: italic clamp(20px, 2.8vw, 32px)
        "Brush Script MT", "Segoe Script", cursive;
    text-shadow:
        0 0 6px #ffffff,
        0 0 16px #d58bfa,
        0 0 30px #a34acb;
}
</style>
</head>

<body>

<div id="signature">for YJL</div>
<div id="message">Merry Christmas</div>

<script type="module">

/* =========================================
   1. THREE.JS 加载
========================================= */

let THREE;

try {
    THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
    );
} catch (error) {
    THREE = await import(
        "https://unpkg.com/three@0.164.1/build/three.module.js"
    );
}


/* =========================================
   2. 场景初始化
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03010a);

scene.fog = new THREE.FogExp2(0x03010a, 0.008);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.7)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.35;

document.body.appendChild(renderer.domElement);


/* =========================================
   3. 相机
========================================= */

const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

const cameraTarget = new THREE.Vector3(0, 3.05, 0);

let azimuth = 0.35;
let polar = 1.28;
let distance = 12.8;

let dragging = false;
let lastX = 0;
let lastY = 0;

function updateCamera() {

    camera.position.set(
        distance * Math.sin(polar) * Math.sin(azimuth),
        cameraTarget.y + distance * Math.cos(polar),
        distance * Math.sin(polar) * Math.cos(azimuth)
    );

    camera.lookAt(cameraTarget);
}

updateCamera();


/* =========================================
   4. 鼠标旋转和缩放
========================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    e => {
        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        renderer.domElement.setPointerCapture(e.pointerId);
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if (!dragging) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        azimuth -= dx * 0.006;

        polar = THREE.MathUtils.clamp(
            polar + dy * 0.004,
            0.28,
            2.75
        );

        lastX = e.clientX;
        lastY = e.clientY;

        updateCamera();
    }
);

function stopDragging() {
    dragging = false;
}

renderer.domElement.addEventListener(
    "pointerup", stopDragging
);

renderer.domElement.addEventListener(
    "pointercancel", stopDragging
);

renderer.domElement.addEventListener(
    "wheel",
    e => {

        e.preventDefault();

        distance = THREE.MathUtils.clamp(
            distance + e.deltaY * 0.008,
            8,
            18
        );

        updateCamera();
    },
    { passive: false }
);


/* =========================================
   5. 基础参数
========================================= */

const TAU = Math.PI * 2;

const BASE_R = 2.2;

const TREE_H = 6.2;

const rand = (a, b) => a + Math.random() * (b - a);

const treeGroup = new THREE.Group();

scene.add(treeGroup);

const clock = new THREE.Clock();

let elapsed = 0;


/* =========================================
   6. 灯光
========================================= */

scene.add(
    new THREE.AmbientLight(0xd7baff, 1.0)
);

scene.add(
    new THREE.HemisphereLight(
        0xf6eaff,
        0x170820,
        1.3
    )
);

const light1 = new THREE.PointLight(
    0xd49aff, 35, 18
);

light1.position.set(0, 4.5, 3);

scene.add(light1);

const light2 = new THREE.PointLight(
    0xffffff, 22, 16
);

light2.position.set(-4, 5, 3);

scene.add(light2);

const light3 = new THREE.PointLight(
    0xa95de8, 30, 18
);

light3.position.set(4, 3, -4);

scene.add(light3);


/* =========================================
   7. 光晕纹理
========================================= */

function createGlowTexture() {

    const canvas = document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const c = canvas.getContext("2d");

    const g = c.createRadialGradient(
        128, 128, 0,
        128, 128, 128
    );

    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.12, "rgba(239,205,255,0.8)");
    g.addColorStop(0.35, "rgba(180,105,235,0.3)");
    g.addColorStop(1, "rgba(100,30,160,0)");

    c.fillStyle = g;

    c.fillRect(0, 0, 256, 256);

    const texture = new THREE.CanvasTexture(canvas);

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

const glowTexture = createGlowTexture();


/* =========================================
   8. 背景星云
========================================= */

function addNebula(x, y, z, sx, sy, opacity) {

    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: glowTexture,
            color: 0xb77be8,
            transparent: true,
            opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    sprite.position.set(x, y, z);

    sprite.scale.set(sx, sy, 1);

    scene.add(sprite);

    return sprite;
}

addNebula(-4, 4, -9, 9, 7, 0.23);
addNebula(4, 3, -10, 8, 7, 0.18);
addNebula(0, 6, -13, 12, 8, 0.15);
addNebula(0, 1, -9, 7, 5, 0.12);


/* =========================================
   9. 星空
========================================= */

const starPositions = [];

const starColors = [];

for (let i = 0; i < 650; i++) {

    starPositions.push(
        rand(-15, 15),
        rand(-4, 13),
        rand(-19, -10)
    );

    const color = new THREE.Color(
        Math.random() > 0.55
            ? 0xf0dcff
            : 0xb990e8
    );

    starColors.push(color.r, color.g, color.b);
}

const starFieldGeometry = new THREE.BufferGeometry();

starFieldGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

starFieldGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(starColors, 3)
);

const starFieldMaterial = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

scene.add(
    new THREE.Points(starFieldGeometry, starFieldMaterial)
);


/* =========================================
   10. 圣诞树分层轮廓
========================================= */

for (let level = 0; level < 9; level++) {

    const bottomY = 0.25 + level * 0.67;

    const height = 1.08;

    const bottomRadius =
        BASE_R * Math.pow(1 - level / 9, 0.9);

    const topRadius = Math.max(
        0.025,
        BASE_R *
        Math.pow(
            Math.max(0.005, 1 - (level + 1.25) / 9),
            0.9
        )
    );

    const geometry = new THREE.CylinderGeometry(
        topRadius,
        bottomRadius,
        height,
        48,
        1,
        true
    );

    const material = new THREE.MeshStandardMaterial({
        color: 0x48215f,
        emissive: 0x35114b,
        emissiveIntensity: 0.55,
        transparent: true,
        opacity: 0.13,
        roughness: 0.75,
        metalness: 0.18,
        side: THREE.DoubleSide,
        depthWrite: false
    });

    const layer = new THREE.Mesh(
        geometry,
        material
    );

    layer.position.y = bottomY + height / 2;

    treeGroup.add(layer);
}


/* =========================================
   11. 树体密集粒子
========================================= */

const foliageColors = [
    0xffffff,
    0xf7ebff,
    0xe7d1ff,
    0xd3a8f3,
    0xc18ae8,
    0xa96bd6,
    0xeee1ff
];

const foliagePositions = [];

const foliageVertexColors = [];

for (let i = 0; i < 12500; i++) {

    const t = Math.pow(Math.random(), 0.88);

    const angle = rand(0, TAU);

    const maxRadius =
        BASE_R * Math.pow(1 - t, 0.86);

    const radial =
        0.55 + 0.45 * Math.pow(Math.random(), 0.42);

    const branchPattern =
        0.88 +
        0.12 * Math.pow(
            Math.cos(angle * 12 + t * 9),
            6
        );

    const radius =
        maxRadius * radial * branchPattern;

    const x = radius * Math.cos(angle);

    const y = 0.25 + t * 5.95;

    const z = radius * Math.sin(angle);

    foliagePositions.push(x, y, z);

    const color = new THREE.Color(
        foliageColors[
            Math.floor(Math.random() * foliageColors.length)
        ]
    );

    foliageVertexColors.push(
        color.r,
        color.g,
        color.b
    );
}

const foliageGeometry = new THREE.BufferGeometry();

foliageGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(foliagePositions, 3)
);

foliageGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(foliageVertexColors, 3)
);

const foliageMaterial = new THREE.PointsMaterial({
    size: 0.062,
    vertexColors: true,
    transparent: true,
    opacity: 0.96,
    sizeAttenuation: true,
    depthWrite: true,
    blending: THREE.AdditiveBlending
});

const foliage = new THREE.Points(
    foliageGeometry,
    foliageMaterial
);

treeGroup.add(foliage);


/* =========================================
   12. 分层树枝结构
========================================= */

const branchMaterial = new THREE.MeshBasicMaterial({
    color: 0xb98add,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
});

for (let level = 0; level < 9; level++) {

    const centerY = 0.65 + level * 0.67;

    const branchLength =
        BASE_R *
        Math.pow(1 - level / 9, 0.9);

    for (let branch = 0; branch < 14; branch++) {

        const angle =
            branch * TAU / 14 + level * 0.16;

        const points = [];

        for (let j = 0; j <= 9; j++) {

            const u = j / 9;

            const r = 0.08 + branchLength * u;

            const y =
                centerY -
                0.48 * u * u +
                0.035 * Math.sin(u * TAU + angle);

            points.push(
                new THREE.Vector3(
                    r * Math.cos(angle),
                    y,
                    r * Math.sin(angle)
                )
            );
        }

        const curve = new THREE.CatmullRomCurve3(points);

        const geometry = new THREE.TubeGeometry(
            curve, 14, 0.014, 4, false
        );

        treeGroup.add(
            new THREE.Mesh(geometry, branchMaterial)
        );
    }
}


/* =========================================
   13. 树干
========================================= */

const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.12, 0.18, 0.85, 16
    ),
    new THREE.MeshStandardMaterial({
        color: 0x482d52,
        roughness: 0.85
    })
);

trunk.position.y = 0.35;

treeGroup.add(trunk);


/* =========================================
   14. 圣诞装饰球
========================================= */

const ornamentGeometry = new THREE.SphereGeometry(
    1, 16, 12
);

const ornamentMaterials = [
    new THREE.MeshPhysicalMaterial({
        color: 0xf5eaff,
        metalness: 0.85,
        roughness: 0.16,
        clearcoat: 1,
        emissive: 0x8e55ad,
        emissiveIntensity: 0.6
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xb77be8,
        metalness: 0.72,
        roughness: 0.18,
        clearcoat: 1,
        emissive: 0x6e2ca0,
        emissiveIntensity: 0.7
    }),

    new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.92,
        roughness: 0.12,
        clearcoat: 1
    })
];

for (let i = 0; i < 55; i++) {

    const t = rand(0.08, 0.88);

    const maxR =
        BASE_R * Math.pow(1 - t, 0.86);

    const angle = rand(0, TAU);

    const radius = maxR * rand(0.88, 1.02);

    const size = rand(0.045, 0.085);

    const ornament = new THREE.Mesh(
        ornamentGeometry,
        ornamentMaterials[
            Math.floor(Math.random() * ornamentMaterials.length)
        ]
    );

    ornament.scale.setScalar(size);

    ornament.position.set(
        radius * Math.cos(angle),
        0.35 + t * 5.3,
        radius * Math.sin(angle)
    );

    treeGroup.add(ornament);
}


/* =========================================
   15. 树身螺旋灯带
========================================= */

const spiralPoints = [];

for (let i = 0; i <= 1200; i++) {

    const t = i / 1200;

    const angle = t * TAU * 5.5;

    const radius =
        BASE_R * 0.97 * Math.pow(1 - t, 0.86);

    spiralPoints.push(
        new THREE.Vector3(
            radius * Math.cos(angle),
            0.35 + t * 5.9,
            radius * Math.sin(angle)
        )
    );
}

const spiralCurve = new THREE.CatmullRomCurve3(
    spiralPoints
);

treeGroup.add(
    new THREE.Mesh(
        new THREE.TubeGeometry(
            spiralCurve, 1200, 0.013, 6, false
        ),
        new THREE.MeshBasicMaterial({
            color: 0xe2c0ff,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    )
);

// 灯带外部柔光
treeGroup.add(
    new THREE.Mesh(
        new THREE.TubeGeometry(
            spiralCurve, 1200, 0.043, 6, false
        ),
        new THREE.MeshBasicMaterial({
            color: 0xa85ee0,
            transparent: true,
            opacity: 0.16,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    )
);


/* =========================================
   16. 闪烁灯珠
========================================= */

const bulbs = [];

const bulbGeometry = new THREE.SphereGeometry(
    0.027, 10, 8
);

for (let i = 0; i < 170; i++) {

    const t = i / 170;

    const p = spiralCurve.getPointAt(t);

    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: i % 3 === 0 ? 0xffffff : 0xdca9ff,
        emissiveIntensity: 1.8,
        roughness: 0.2
    });

    const bulb = new THREE.Mesh(
        bulbGeometry,
        material
    );

    bulb.position.copy(p);

    treeGroup.add(bulb);

    bulbs.push({
        mesh: bulb,
        material,
        phase: rand(0, TAU)
    });
}


/* =========================================
   17. 树顶双层水晶八角星
========================================= */

const starShape = new THREE.Shape();

for (let i = 0; i < 16; i++) {

    const angle = -Math.PI / 2 + i * Math.PI / 8;

    const radius = i % 2 === 0 ? 0.43 : 0.19;

    const x = Math.cos(angle) * radius;

    const y = Math.sin(angle) * radius;

    if (i === 0) {
        starShape.moveTo(x, y);
    } else {
        starShape.lineTo(x, y);
    }
}

starShape.closePath();

const starGeometry = new THREE.ExtrudeGeometry(
    starShape,
    {
        depth: 0.13,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
    }
);

starGeometry.center();

const starMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0.62,
    roughness: 0.1,
    clearcoat: 1,
    emissive: 0xdcb0ff,
    emissiveIntensity: 2.2
});

const starBackMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xc38cf1,
    metalness: 0.7,
    roughness: 0.18,
    transparent: true,
    opacity: 0.9,
    emissive: 0x9b55d3,
    emissiveIntensity: 1.2
});

const starGroup = new THREE.Group();

starGroup.position.set(0, TREE_H + 0.45, 0);

treeGroup.add(starGroup);

// 后层水晶
const starBack = new THREE.Mesh(
    starGeometry,
    starBackMaterial
);

starBack.scale.setScalar(0.78);

starBack.position.z = -0.10;

starGroup.add(starBack);

// 前层水晶
const starMesh = new THREE.Mesh(
    starGeometry,
    starMaterial
);

starMesh.position.z = 0.02;

starMesh.rotation.y = 0.08;

starGroup.add(starMesh);

// 水晶切面
starMesh.add(
    new THREE.LineSegments(
        new THREE.EdgesGeometry(starGeometry),
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.85
        })
    )
);

// 星星中心亮点
const starCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 16, 12),
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    })
);

starCore.position.z = 0.12;

starGroup.add(starCore);

// 星星光晕
const starHalo = new THREE.Sprite(
    new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xe2b5ff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

starHalo.scale.set(1.9, 1.9, 1);

starGroup.add(starHalo);

const starLight = new THREE.PointLight(
    0xe3bdff, 8, 4
);

starLight.position.set(0, TREE_H + 0.5, 0.3);

treeGroup.add(starLight);


/* =========================================
   18. 四组不同角度的3D环绕轨迹
========================================= */

const orbitSpecs = [
    {
        y: 1.45,
        rx: 2.42,
        rz: 2.15,
        tiltX: 0.55,
        tiltZ: -0.25,
        wave: 0.42,
        phase: 0.2,
        color: 0xe5baff,
        speed: 0.055
    },

    {
        y: 2.35,
        rx: 2.65,
        rz: 2.35,
        tiltX: -0.25,
        tiltZ: 0.42,
        wave: 0.35,
        phase: 1.5,
        color: 0xffffff,
        speed: 0.038
    },

    {
        y: 3.15,
        rx: 1.95,
        rz: 2.10,
        tiltX: -0.48,
        tiltZ: 0.30,
        wave: 0.35,
        phase: 2.4,
        color: 0xd5a1ff,
        speed: 0.062
    },

    {
        y: 4.65,
        rx: 1.35,
        rz: 1.45,
        tiltX: 0.40,
        tiltZ: 0.50,
        wave: 0.25,
        phase: 3.1,
        color: 0xe9caff,
        speed: 0.045
    }
];

const orbitSystems = [];

function createOrbit(spec) {

    const group = new THREE.Group();

    group.position.y = spec.y;

    group.rotation.set(
        spec.tiltX,
        0,
        spec.tiltZ
    );

    treeGroup.add(group);

    const points = [];

    for (let i = 0; i < 420; i++) {

        const a = i / 420 * TAU;

        points.push(
            new THREE.Vector3(
                spec.rx * Math.cos(a),
                Math.sin(a * 2 + spec.phase) * spec.wave,
                spec.rz * Math.sin(a)
            )
        );
    }

    const curve = new THREE.CatmullRomCurve3(
        points,
        true,
        "centripetal"
    );

    // 外部光晕
    group.add(
        new THREE.Mesh(
            new THREE.TubeGeometry(
                curve, 600, 0.05, 6, true
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.16,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        )
    );

    // 核心光轨
    group.add(
        new THREE.Mesh(
            new THREE.TubeGeometry(
                curve, 600, 0.015, 6, true
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        )
    );

    // 流动光珠
    const beads = [];

    const beadGeometry = new THREE.SphereGeometry(
        0.025, 8, 8
    );

    const beadMaterial = new THREE.MeshBasicMaterial({
        color: spec.color
    });

    for (let i = 0; i < 12; i++) {

        const bead = new THREE.Mesh(
            beadGeometry,
            beadMaterial
        );

        group.add(bead);

        beads.push(bead);
    }

    // 彗星头部
    const comet = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 12, 12),
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })
    );

    group.add(comet);

    // 彗星拖尾
    const tail = [];

    for (let i = 0; i < 10; i++) {

        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(
                0.045 * (1 - i / 13),
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color: spec.color,
                transparent: true,
                opacity: 0.65 * (1 - i / 10),
                blending: THREE.AdditiveBlending
            })
        );

        group.add(particle);

        tail.push(particle);
    }

    orbitSystems.push({
        curve,
        beads,
        comet,
        tail,
        speed: spec.speed,
        phase: spec.phase
    });
}

orbitSpecs.forEach(createOrbit);


/* =========================================
   19. 地面光环
========================================= */

const baseRings = [];

[2.65, 3.35, 4.0].forEach((radius, i) => {

    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
            radius, 0.009, 6, 240
        ),
        new THREE.MeshBasicMaterial({
            color: i === 1 ? 0xe0b7ff : 0xa96de2,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    ring.rotation.x = Math.PI / 2;

    ring.position.y = 0.06 + i * 0.012;

    treeGroup.add(ring);

    baseRings.push(ring);
});

// 地面柔光
const floorGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 8),
    new THREE.MeshBasicMaterial({
        map: glowTexture,
        color: 0xc58bff,
        transparent: true,
        opacity: 0.32,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
    })
);

floorGlow.rotation.x = -Math.PI / 2;

floorGlow.position.y = 0.035;

treeGroup.add(floorGlow);


/* =========================================
   20. 雪花系统
   远景115片 + 近景35片
========================================= */

function createSnow(count, zMin, zMax, size, opacity) {

    const positions = new Float32Array(count * 3);

    const speeds = [];
    const drifts = [];
    const phases = [];

    for (let i = 0; i < count; i++) {

        positions[i * 3] = rand(-7, 7);

        positions[i * 3 + 1] = rand(-1, 8);

        positions[i * 3 + 2] = rand(zMin, zMax);

        speeds.push(rand(0.35, 0.95));

        drifts.push(rand(-0.3, 0.3));

        phases.push(rand(0, TAU));
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({
        color: 0xf6eaff,
        size,
        transparent: true,
        opacity,
        depthWrite: false,
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(
        geometry,
        material
    );

    scene.add(points);

    return {
        geometry,
        speeds,
        drifts,
        phases,
        count
    };
}

const farSnow = createSnow(
    115, -9, -5, 0.06, 0.55
);

const nearSnow = createSnow(
    35, 3.5, 5.5, 0.12, 0.72
);


/* =========================================
   21. 雪花下落动画
========================================= */

function updateSnow(snow, dt) {

    const positions =
        snow.geometry.attributes.position.array;

    for (let i = 0; i < snow.count; i++) {

        const index = i * 3;

        positions[index + 1] -=
            snow.speeds[i] * dt;

        positions[index] += (
            snow.drifts[i] +
            Math.sin(
                elapsed * 1.2 + snow.phases[i]
            ) * 0.08
        ) * dt;

        if (positions[index + 1] < -1.2) {

            positions[index + 1] = 8.5;

            positions[index] = rand(-7, 7);
        }

        if (positions[index] > 7.2) {
            positions[index] = -7.2;
        }

        if (positions[index] < -7.2) {
            positions[index] = 7.2;
        }
    }

    snow.geometry.attributes.position.needsUpdate = true;
}


/* =========================================
   22. 灯珠闪烁
========================================= */

function updateBulbs() {

    for (const b of bulbs) {

        const f =
            0.5 +
            0.5 * Math.sin(
                elapsed * 2.8 + b.phase
            );

        b.material.emissiveIntensity =
            0.7 + f * 2.3;

        b.mesh.scale.setScalar(
            0.75 + f * 0.55
        );
    }
}


/* =========================================
   23. 环绕彗星运动
========================================= */

function updateOrbits() {

    for (const system of orbitSystems) {

        const t =
            elapsed * system.speed +
            system.phase / TAU;

        const normalizedT =
            ((t % 1) + 1) % 1;

        system.beads.forEach((bead, i) => {

            const beadT = (
                normalizedT + i / system.beads.length
            ) % 1;

            bead.position.copy(
                system.curve.getPointAt(beadT)
            );

            const pulse =
                0.65 +
                0.35 * Math.sin(elapsed * 2 + i);

            bead.scale.setScalar(pulse);
        });

        system.comet.position.copy(
            system.curve.getPointAt(normalizedT)
        );

        system.tail.forEach((particle, i) => {

            const tailT =
                (
                    normalizedT - (i + 1) * 0.012 + 1
                ) % 1;

            particle.position.copy(
                system.curve.getPointAt(tailT)
            );
        });
    }
}


/* =========================================
   24. 水晶星星闪烁
========================================= */

function updateStar() {

    starGroup.rotation.y =
        Math.sin(elapsed * 0.6) * 0.18;

    starGroup.rotation.z =
        Math.sin(elapsed * 0.8) * 0.04;

    const pulse =
        1 + 0.06 * Math.sin(elapsed * 2.4);

    starMesh.scale.setScalar(pulse);

    starMaterial.emissiveIntensity =
        1.5 + 1.5 * (
            0.5 + 0.5 * Math.sin(elapsed * 2.4)
        );

    starHalo.material.opacity =
        0.55 + 0.4 * (
            0.5 + 0.5 * Math.sin(elapsed * 2)
        );

    starLight.intensity =
        6 + 4 * Math.sin(elapsed * 2);
}


/* =========================================
   25. 星空呼吸效果
========================================= */

function updateStars() {

    starFieldMaterial.opacity =
        0.55 + 0.3 * (
            0.5 + 0.5 * Math.sin(elapsed * 1.2)
        );
}


/* =========================================
   26. 窗口尺寸变化
========================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.fov =
        window.innerWidth < 650 ? 47 : 42;

    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.7)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});


/* =========================================
   27. 主动画
========================================= */

function animate() {

    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.04);

    elapsed += dt;

    // 自动缓慢旋转
    if (!dragging) {

        azimuth += dt * 0.045;

        updateCamera();
    }

    updateBulbs();

    updateOrbits();

    updateStar();

    updateStars();

    updateSnow(farSnow, dt);

    updateSnow(nearSnow, dt);

    // 地面光环轻微运动
    baseRings.forEach((ring, i) => {

        ring.rotation.z =
            Math.sin(elapsed * 0.15 + i) * 0.06;
    });

    // 光照呼吸
    light1.intensity =
        29 + 6 * Math.sin(elapsed * 0.8);

    renderer.render(scene, camera);
}

animate();

</script>
